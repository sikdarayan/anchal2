<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F3F5" />
<meta name="robots" content="noindex, nofollow" />
<title>Anchal — Owner Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#A63D5C;--rose-dark:#7B2A45;--deep:#4A1428;--gold:#C9A961;--gold-soft:#E6D3A3;
  --cream:#FFFAF7;--blush:#FBEDF0;--blush-2:#F3D8E0;--pink:#EC3B7D;--ink:#2B1B22;
  --muted:#8A6B76;--line:#F0DDE2;--green:#1E7A5A;--red:#C8102E;--amber:#E08C2B;
  --radius:18px;--tap:44px;--maxw:1280px;
  --shadow:0 10px 30px -14px rgba(74,20,40,.28);
  --shadow-lg:0 28px 60px -24px rgba(74,20,40,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:#F7F3F5;color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.18;font-weight:600;letter-spacing:-.015em}
p{margin:0}
.container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 24px}
input,select,textarea{font-size:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:999px;border:1px solid transparent;font-size:.86rem;font-weight:500;cursor:pointer;transition:.25s;white-space:nowrap;min-height:var(--tap);touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--rose);color:#fff}
.btn-primary:hover{background:var(--rose-dark)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--rose);color:var(--rose)}
.btn-danger{background:#fff;border-color:var(--line);color:var(--red)}
.btn-danger:hover{border-color:var(--red);background:#FFF5F5}
.btn-sm{padding:9px 16px;font-size:.78rem;min-height:38px}
.btn-block{width:100%}

.topbar{background:var(--deep);color:#fff;padding:14px 0;padding-top:calc(14px + env(safe-area-inset-top,0))}
.topbar .inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topbar .brand{display:flex;align-items:center;gap:12px;font-size:.82rem;color:#E8B8C7;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 4px rgba(74,222,128,.2);animation:pulse 2s infinite;flex:0 0 10px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(74,222,128,.2)}50%{box-shadow:0 0 0 8px rgba(74,222,128,.05)}}
.topbar .brand .logo-mini{width:34px;height:34px;flex:0 0 34px}
.topbar .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.topbar .email{font-size:.8rem;color:#C6A3B1;text-transform:none;letter-spacing:0;font-weight:400}

.wrap{padding:36px 0 80px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;margin-bottom:22px}
.panel h2{font-size:1.08rem;margin-bottom:6px;display:flex;align-items:center;gap:10px}
.panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--rose);flex:0 0 8px}
.panel .sub{color:var(--muted);font-size:.84rem;margin-bottom:22px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;position:relative;overflow:hidden}
.stat-card .lbl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
.stat-card .val{font-size:1.9rem;font-weight:600;color:var(--deep);line-height:1}
.stat-card .subl{font-size:.76rem;color:var(--muted);margin-top:8px}
.stat-card .ic{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:12px;background:var(--blush);display:grid;place-items:center;color:var(--rose);font-size:1rem}
.stat-card.highlight{background:linear-gradient(135deg,#4A1428,#7B2A45);color:#fff}
.stat-card.highlight .lbl,.stat-card.highlight .subl{color:#E8B8C7}
.stat-card.highlight .val{color:#fff}
.stat-card.highlight .ic{background:rgba(255,255,255,.14);color:var(--gold)}

.charts-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:22px;margin-bottom:22px}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;display:flex;flex-direction:column}
.chart-card h2{font-size:1.02rem;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chart-card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--rose);flex:0 0 8px}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:#E4F5EE;padding:4px 10px;border-radius:999px;margin-left:auto}
.live-badge .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
.chart-card .sub{color:var(--muted);font-size:.8rem;margin-bottom:18px}
.chart-card svg text{font-family:'Poppins',sans-serif}

.lb-row{display:grid;grid-template-columns:minmax(140px,1.5fr) 1fr auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:0}
.lb-name{font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-bar-wrap{background:var(--blush);border-radius:999px;height:12px;overflow:hidden;position:relative}
.lb-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--rose),var(--pink));transition:width .8s cubic-bezier(.2,.7,.3,1);min-width:0}
.lb-count{font-size:.86rem;font-weight:600;color:var(--deep);min-width:44px;text-align:right}
.lb-count.zero{color:var(--muted);font-weight:400}
.untouched-pill{display:inline-block;background:#F1E5D5;color:#8C6A2E;font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin:3px 4px 0 0}

.legend{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.legend-row{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:.84rem}
.legend-dot{width:12px;height:12px;border-radius:3px}
.legend-label{color:var(--muted)}
.legend-value{font-weight:600;color:var(--deep)}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -8px}
table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:820px}
thead th{text-align:left;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 14px;border-bottom:1px solid var(--line)}
tbody tr{background:var(--cream)}
tbody tr:hover{background:var(--blush)}
tbody td{padding:14px;font-size:.85rem;vertical-align:middle;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tbody td:first-child{border-left:1px solid var(--line);border-top-left-radius:12px;border-bottom-left-radius:12px}
tbody td:last-child{border-right:1px solid var(--line);border-top-right-radius:12px;border-bottom-right-radius:12px}
.tbl-product{display:flex;align-items:center;gap:12px;min-width:200px}
.tbl-thumb{width:44px;height:56px;border-radius:8px;overflow:hidden;flex:0 0 44px;background:var(--blush)}
.tbl-thumb .saree-art{height:100%}
.tbl-info strong{display:block;font-weight:500;font-size:.86rem;line-height:1.3}
.tbl-info span{font-size:.72rem;color:var(--muted)}
.stock-input{width:72px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center;font-size:.85rem;font-weight:500;outline:none;min-height:38px}
.stock-input:focus{border-color:var(--rose)}
.stock-input.low{border-color:var(--amber);background:#FFF8EE}
.stock-input.out{border-color:var(--red);background:#FFF0F2;color:var(--red)}
.fav-cell{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--deep)}
.fav-cell.zero{color:var(--muted);font-weight:400}
.fav-cell .heart-ic{color:var(--pink)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--red);color:var(--red);background:#FFF5F5}

.add-form{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.add-form .field{margin-bottom:16px}
.add-form .field.full{grid-column:1/-1}
.field label{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--cream);outline:none;font-size:16px;min-height:var(--tap);font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--rose);background:#fff}
.field textarea{resize:vertical;min-height:90px}
.palette-picker{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.palette-swatch{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden;padding:0;background:none}
.palette-swatch::after{content:'';position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%)}
.palette-swatch.active{border-color:var(--rose);transform:scale(1.06)}
.palette-swatch.active::before{content:'✓';position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:50%;background:var(--rose);color:#fff;font-size:.6rem;font-weight:700;display:grid;place-items:center;z-index:2;border:2px solid #fff}

/* AUTH */
.auth-wrap{min-height:100vh;display:grid;place-items:center;padding:40px 20px;background:radial-gradient(circle at 20% 30%,#FDEAF1,#F7F3F5 70%)}
.auth-card{max-width:460px;width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:38px 36px;box-shadow:var(--shadow)}
.auth-logo{width:88px;height:88px;margin:0 auto 18px;border-radius:50%}
.auth-card h1{font-size:1.35rem;text-align:center;margin-bottom:6px}
.auth-card > p.sub{color:var(--muted);font-size:.86rem;text-align:center;margin-bottom:26px}
.auth-tabs{display:flex;gap:6px;background:var(--blush);border-radius:999px;padding:5px;margin-bottom:22px}
.auth-tab{flex:1;padding:10px;border:0;background:transparent;border-radius:999px;font-size:.82rem;font-weight:500;color:var(--muted);cursor:pointer;transition:.2s;font-family:inherit}
.auth-tab.active{background:#fff;color:var(--rose);box-shadow:0 2px 8px -4px rgba(74,20,40,.2)}
.field{margin-bottom:16px}
.auth-form button[type="submit"],
form[data-form="change-password"] button[type="submit"]{margin-top:12px}
.auth-form button[type="submit"]{margin-top:8px}
.auth-note{font-size:.76rem;color:var(--muted);text-align:center;margin-top:18px;line-height:1.55}
.auth-note a{color:var(--rose);font-weight:500;cursor:pointer}
.auth-note a:hover{text-decoration:underline}
.form-msg{padding:11px 14px;border-radius:10px;font-size:.82rem;margin-bottom:14px;line-height:1.5}
.form-msg.error{background:#FFF0F2;border:1px solid #F4C7CC;color:var(--red)}
.form-msg.success{background:#E4F5EE;border:1px solid #B8E0CC;color:var(--green)}
.form-msg.info{background:#FFF8EE;border:1px solid #F0D9B5;color:#8C6A2E}

.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0));transform:translate(-50%,40px);opacity:0;visibility:hidden;background:var(--deep);color:#fff;padding:14px 26px;border-radius:999px;font-size:.85rem;box-shadow:var(--shadow-lg);z-index:200;transition:transform .35s cubic-bezier(.2,.8,.3,1), opacity .35s, visibility .35s;white-space:nowrap;max-width:90vw;display:flex;align-items:center;gap:10px;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

/* ============================================================
   TABLET LANDSCAPE — 1024px and below
   ============================================================ */
@media (max-width:1024px){
  .container{padding:0 28px}
  .wrap{padding:28px 0 60px}
  .stats{grid-template-columns:repeat(2,1fr);gap:14px}
  .charts-grid{grid-template-columns:1fr;gap:18px}
  .chart-card{padding:22px 24px}
  .panel{padding:24px 26px}
  .topbar .inner{gap:12px}
  table{min-width:760px}
  thead th{padding:8px 12px}
  tbody td{padding:12px}
}

/* ============================================================
   TABLET PORTRAIT — 900px and below
   ============================================================ */
@media (max-width:900px){
  .container{padding:0 24px}
  .wrap{padding:24px 0 56px}

  /* Topbar stacks brand + actions */
  .topbar .inner{flex-direction:column;align-items:stretch;gap:14px}
  .topbar .brand{white-space:nowrap;overflow:hidden;min-width:0}
  .topbar .brand .logo-mini,
  .topbar .brand .dot{flex-shrink:0}
  .topbar .actions{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .topbar .actions .btn{width:100%}

  .panel{padding:22px 22px}
  .chart-card{padding:20px 20px}

  /* Leaderboard rows: bar drops to its own line */
  .lb-row{grid-template-columns:1fr auto;gap:10px;padding:10px 0}
  .lb-bar-wrap{grid-column:1/-1;order:3;margin-top:4px}
  .lb-name{white-space:normal;font-size:.86rem;line-height:1.35}

  /* Form stacks to 1 column */
  .add-form{grid-template-columns:1fr;gap:0}

  /* Table gets slightly tighter */
  table{min-width:720px}
  thead th{font-size:.65rem;padding:7px 10px}
  tbody td{padding:12px 10px;font-size:.83rem}
  .tbl-thumb{width:40px;height:52px;flex:0 0 40px}
  .tbl-product{min-width:180px;gap:10px}

  /* Touch-friendly controls */
  .icon-btn{width:44px;height:44px;border-radius:12px}
  .stock-input{width:70px;min-height:44px;font-size:16px}
  .btn-sm{min-height:44px}
}

/* ============================================================
   LARGE PHONE / SMALL TABLET — 640px and below
   ============================================================ */
@media (max-width:640px){
  .container{padding:0 18px}
  .wrap{padding:20px 0 48px}

  /* Stats collapse to single column */
  .stats{grid-template-columns:1fr;gap:12px;margin-bottom:18px}
  .stat-card{padding:18px 20px}
  .stat-card .lbl{font-size:.68rem}
  .stat-card .val{font-size:1.55rem}
  .stat-card .subl{font-size:.74rem}
  .stat-card .ic{width:34px;height:34px;top:16px;right:16px;border-radius:10px;font-size:.95rem}

  .panel{padding:20px 18px;margin-bottom:18px}
  .panel h2{font-size:1rem}
  .panel .sub{font-size:.8rem;margin-bottom:16px}

  .chart-card{padding:18px 16px}
  .chart-card h2{font-size:.98rem;gap:8px}
  .chart-card .sub{font-size:.78rem;margin-bottom:14px}
  .live-badge{font-size:.62rem;padding:3px 9px}
  .live-badge .pulse-dot{width:6px;height:6px;flex:0 0 6px}

  /* Topbar */
  .topbar{padding:12px 0;padding-top:calc(12px + env(safe-area-inset-top,0))}
  .topbar .brand{font-size:.78rem;gap:10px}
  .topbar .brand .logo-mini{width:30px;height:30px;flex:0 0 30px}
  .topbar .brand .dot{width:8px;height:8px;flex:0 0 8px}
  .topbar .actions{gap:8px}
  .topbar .actions .btn{font-size:.78rem;padding:10px 14px;min-height:42px}

  /* Auth screens */
  .auth-wrap{padding:24px 16px}
  .auth-card{padding:28px 22px}
  .auth-logo{width:76px;height:76px;margin-bottom:14px}
  .auth-card h1{font-size:1.22rem}
  .auth-card > p.sub{font-size:.82rem;margin-bottom:20px}
  .auth-tabs{padding:4px;margin-bottom:18px}
  .auth-tab{padding:10px;font-size:.8rem}
  .auth-note{font-size:.74rem}

  /* Table — scrolls horizontally, tighter cells */
  table{min-width:660px}
  thead th{font-size:.6rem;padding:6px 9px;letter-spacing:.1em}
  tbody td{padding:11px 9px;font-size:.8rem}
  .tbl-product{min-width:160px;gap:9px}
  .tbl-thumb{width:36px;height:46px;flex:0 0 36px;border-radius:6px}
  .tbl-info strong{font-size:.8rem}
  .tbl-info span{font-size:.68rem}
  .stock-input{width:62px;min-height:42px;padding:8px;font-size:15px}
  .icon-btn{width:42px;height:42px}
  .fav-cell{font-size:.82rem}

  /* Buttons */
  .btn{padding:12px 20px;font-size:.85rem}
  .btn-sm{padding:10px 16px;font-size:.78rem;min-height:42px}

  /* Form fields */
  .add-form .field{margin-bottom:14px}
  .field label{font-size:.68rem}
  .field input,.field textarea,.field select{padding:12px 14px;font-size:16px;min-height:42px}

  /* Palette picker */
  .palette-picker{gap:8px}
  .palette-swatch{width:42px;height:42px}

  /* Leaderboard */
  .lb-row{padding:9px 0;gap:8px}
  .lb-count{font-size:.82rem;min-width:36px}
  .lb-name{font-size:.82rem}

  /* Chart legend */
  .legend{gap:8px;margin-top:12px}
  .legend-row{font-size:.8rem;gap:8px}
  .legend-dot{width:11px;height:11px;flex:0 0 11px}

  .untouched-pill{font-size:.6rem;padding:3px 8px}
}

/* ============================================================
   STANDARD PHONE — 480px and below
   ============================================================ */
@media (max-width:480px){
  .container{padding:0 14px}
  .wrap{padding:16px 0 42px}

  .topbar{padding:10px 0;padding-top:calc(10px + env(safe-area-inset-top,0))}
  .topbar .brand{font-size:.72rem;letter-spacing:.04em;gap:9px}
  .topbar .brand .logo-mini{width:28px;height:28px;flex:0 0 28px}
  .topbar .actions .btn{font-size:.74rem;padding:9px 12px;min-height:40px}

  .stat-card{padding:16px 18px}
  .stat-card .val{font-size:1.42rem}
  .stat-card .ic{width:32px;height:32px;top:14px;right:14px;border-radius:9px;font-size:.9rem}

  .panel{padding:18px 14px}
  .panel h2{font-size:.96rem}
  .panel .sub{font-size:.76rem}

  .chart-card{padding:16px 14px}
  .chart-card h2{font-size:.92rem}
  .chart-card h2 .dot{width:7px;height:7px;flex:0 0 7px}

  /* Auth */
  .auth-card{padding:24px 16px}
  .auth-logo{width:70px;height:70px;margin-bottom:12px}
  .auth-card h1{font-size:1.12rem}
  .auth-card > p.sub{font-size:.78rem}
  .auth-tab{font-size:.76rem;padding:9px}
  .form-msg{font-size:.78rem;padding:10px 12px}

  /* Table */
  table{min-width:600px}
  thead th{font-size:.56rem;padding:6px 8px}
  tbody td{padding:10px 8px;font-size:.78rem}
  .tbl-product{min-width:150px;gap:8px}
  .tbl-thumb{width:34px;height:44px;flex:0 0 34px}
  .tbl-info strong{font-size:.78rem;line-height:1.3}
  .tbl-info span{font-size:.64rem}
  .stock-input{width:58px;min-height:42px;font-size:15px}
  .icon-btn{width:42px;height:42px}

  /* Buttons */
  .btn{padding:11px 18px;font-size:.83rem;min-height:42px}
  .btn-sm{padding:9px 14px;font-size:.74rem;min-height:40px}

  /* Palette */
  .palette-picker{gap:7px}
  .palette-swatch{width:40px;height:40px}

  .lb-name{font-size:.8rem}
  .lb-count{font-size:.8rem;min-width:32px}
  .legend-row{font-size:.76rem}

  .untouched-pill{font-size:.58rem;padding:2px 7px}
}

/* ============================================================
   SMALL PHONE — 380px and below
   ============================================================ */
@media (max-width:380px){
  .container{padding:0 12px}
  .wrap{padding:14px 0 36px}

  .topbar .brand{font-size:.68rem}
  .topbar .brand .logo-mini{width:26px;height:26px;flex:0 0 26px}
  .topbar .brand .dot{width:7px;height:7px;flex:0 0 7px}
  .topbar .actions .btn{font-size:.72rem;padding:8px 11px;min-height:38px}

  .stat-card{padding:14px 16px}
  .stat-card .val{font-size:1.3rem}
  .stat-card .lbl{font-size:.64rem}
  .stat-card .subl{font-size:.7rem}
  .stat-card .ic{width:30px;height:30px;top:12px;right:12px;border-radius:8px;font-size:.85rem}

  .panel{padding:16px 12px}
  .panel h2{font-size:.9rem}
  .chart-card{padding:14px 12px}
  .chart-card h2{font-size:.88rem}

  .auth-card{padding:22px 14px}
  .auth-logo{width:64px;height:64px;margin-bottom:10px}

<body>
<main id="app"></main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================================
   CONFIGURE — paste the SAME Supabase URL and anon key as index.html
   ========================================================================= */
const SUPABASE_URL = 'https://jvsnfoedzueisooxpnzx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9yGQ3eRp84uUTw7NBrMbbw_zj-PGtHo';

const sb = (SUPABASE_URL.startsWith('http'))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
  : null;

/* =========================================================================
   LOGO (same markup as index.html)
   ========================================================================= */
function logoMarkup(){
  return `<img src="anchal_logo.png" alt="Anchal" style="width:100%;height:100%;object-fit:contain;border-radius:50%;" />`;
}

/* =========================================================================
   STATE
   ========================================================================= */
let SAREES = [];
let FAVOURITE_COUNTS = {};   // { saree_id: count }
let SESSION = null;
let svgUid = 0;
let liveChannel = null;
let authTab = 'signin';       // signin | signup | forgot
let authMsg = null;           // { type, text }
let PENDING = { stock:{}, deletes:new Set() };

/* =========================================================================
   HELPERS
   ========================================================================= */
const money = n => '₹' + Number(n).toLocaleString('en-IN');
const escapeHtml = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const findSaree = id => SAREES.find(s => s.id === id);

function sareeArt(p){
  const id = 'a' + (svgUid++);
  const pal = p.palette || ['#8C2342','#4A0F23'];
  const [c1, c2] = pal;
  const gold = p.gold || '#C9A961';
  return `<svg class="saree-art" viewBox="0 0 300 400" preserveAspectRatio="xMidYMid slice">
    <defs>
      <linearGradient id="bg${id}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>
      <linearGradient id="pl${id}" x1="0" y1="0" x2="0.4" y2="1"><stop offset="0" stop-color="${c2}" stop-opacity=".95"/><stop offset="1" stop-color="${c1}" stop-opacity=".8"/></linearGradient>
      <pattern id="mot${id}" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M22 10 L30 22 L22 34 L14 22 Z" fill="none" stroke="${gold}" stroke-width="1"/><circle cx="22" cy="22" r="2.2" fill="${gold}"/></pattern>
    </defs>
    <rect width="300" height="400" fill="url(#bg${id})"/>
    <rect width="300" height="400" fill="url(#mot${id})" opacity=".2"/>
    <path d="M300 0 L300 400 L176 400 L214 0 Z" fill="url(#pl${id})" opacity=".92"/>
    <path d="M214 0 L176 400" stroke="${gold}" stroke-width="3" fill="none" opacity=".85"/>
    <rect y="370" width="300" height="4" fill="${gold}" opacity=".9"/>
  </svg>`;
}

/* =========================================================================
   DATA
   ========================================================================= */
async function loadSarees(){
  if(!sb) return;
  const { data } = await sb.from('sarees').select('*').order('created_at', { ascending: false });
  SAREES = data || [];
}
async function loadFavouriteCounts(){
  if(!sb) return;
  const { data } = await sb.from('favourites').select('saree_id');
  const counts = {};
  (data || []).forEach(r => { counts[r.saree_id] = (counts[r.saree_id] || 0) + 1; });
  FAVOURITE_COUNTS = counts;
}
async function loadSession(){
  if(!sb){ SESSION = null; return; }
  const { data: { session } } = await sb.auth.getSession();
  SESSION = session;
}

/* =========================================================================
   AUTH
   ========================================================================= */
async function signUp(email, password){
  authMsg = null;
  const { error } = await sb.auth.signUp({ email, password });
  if(error){ authMsg = { type:'error', text: error.message }; return; }
  // Try immediate sign in (in case email confirmation is off)
  const { error: e2 } = await sb.auth.signInWithPassword({ email, password });
  if(e2){ authMsg = { type:'info', text: 'Account created. Please check your email to confirm, then sign in.' }; authTab = 'signin'; return; }
  await loadSession();
  render();
}
async function signIn(email, password){
  authMsg = null;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ authMsg = { type:'error', text: error.message }; render(); return; }
  await loadSession();
  await loadSarees(); await loadFavouriteCounts();
  subscribeRealtime();
  render();
}
async function signOut(){
  await sb.auth.signOut();
  if(liveChannel){ sb.removeChannel(liveChannel); liveChannel = null; }
  SESSION = null;
  render();
}
async function sendReset(email){
  authMsg = null;
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname + '#reset'
  });
  if(error){ authMsg = { type:'error', text: error.message }; render(); return; }
  authMsg = { type:'success', text: 'Reset link sent. Check your inbox and follow the link to set a new password.' };
  render();
}
async function changePassword(newPassword){
  authMsg = null;
  const { error } = await sb.auth.updateUser({ password: newPassword });
  if(error){ toast(error.message, 'error'); return; }
  toast('Password updated successfully', 'success');
}

/* Handle password-reset redirect (user clicked the email link) */
async function handleResetRedirect(){
  if(!location.hash.includes('reset')) return false;
  // Supabase sets a session from the URL hash automatically
  await loadSession();
  if(!SESSION) return false;
  return true;
}

/* =========================================================================
   REALTIME SUBSCRIPTION — makes the favourites graph "live"
   ========================================================================= */
function subscribeRealtime(){
  if(!sb || liveChannel) return;
  liveChannel = sb.channel('favourites_live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'favourites' }, async () => {
      await loadFavouriteCounts();
      render();
    })
    .subscribe();
}

/* =========================================================================
   CHART — real-time favourites bar chart
   ========================================================================= */
function renderFavouritesChart(){
  const ranked = [...SAREES].sort((a,b) => (FAVOURITE_COUNTS[b.id] || 0) - (FAVOURITE_COUNTS[a.id] || 0));
  const max = Math.max(1, ...ranked.map(s => FAVOURITE_COUNTS[s.id] || 0));
  const untouched = ranked.filter(s => !FAVOURITE_COUNTS[s.id]);
  const total = Object.values(FAVOURITE_COUNTS).reduce((s, n) => s + n, 0);

  if(SAREES.length === 0){
    return `<div style="text-align:center;padding:40px;color:var(--muted);font-size:.86rem">Add sarees to see favourites.</div>`;
  }
  return `
    <div style="margin-bottom:18px;display:flex;gap:26px;flex-wrap:wrap">
      <div><span style="font-size:1.7rem;font-weight:600;color:var(--deep);line-height:1">${total}</span><div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px">Total Favourites</div></div>
      <div><span style="font-size:1.7rem;font-weight:600;color:var(--deep);line-height:1">${ranked[0] && (FAVOURITE_COUNTS[ranked[0].id] || 0) > 0 ? ranked[0].name : '—'}</span><div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px">Top Favourite</div></div>
      <div><span style="font-size:1.7rem;font-weight:600;color:var(--deep);line-height:1">${untouched.length}</span><div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px">Never Favourited</div></div>
    </div>
    <div>
      ${ranked.map(s => {
        const c = FAVOURITE_COUNTS[s.id] || 0;
        const pct = c > 0 ? Math.max(5, (c / max) * 100) : 0;
        return `<div class="lb-row">
          <div class="lb-name" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
          <div class="lb-bar-wrap"><div class="lb-bar" style="width:${pct}%"></div></div>
          <div class="lb-count ${c === 0 ? 'zero' : ''}">${c}</div>
        </div>`;
      }).join('')}
    </div>
    ${untouched.length ? `<p style="margin-top:20px;font-size:.83rem;color:var(--muted)"><b style="color:var(--ink)">Never touched:</b><br>${untouched.map(s => `<span class="untouched-pill">${escapeHtml(s.name)}</span>`).join('')}</p>` : ''}
  `;
}

function renderStockDonut(){
  const inStock = SAREES.filter(p => p.stock > 5).length;
  const low = SAREES.filter(p => p.stock > 0 && p.stock <= 5).length;
  const out = SAREES.filter(p => p.stock <= 0).length;
  const total = SAREES.length;
  if(total === 0) return `<div style="text-align:center;padding:40px;color:var(--muted);font-size:.86rem">No sarees yet.</div>`;

  const segs = [
    { label:'In Stock', value:inStock, color:'#1E7A5A' },
    { label:'Low Stock', value:low, color:'#E08C2B' },
    { label:'Out of Stock', value:out, color:'#C8102E' }
  ];
  const R = 70, CX = 100, CY = 100, S = 26;
  const circ = 2 * Math.PI * R;
  let offset = 0;
  const arcs = segs.map(s => {
    if(s.value === 0) return '';
    const dash = (s.value / total) * circ;
    const gap = circ - dash;
    const arc = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${s.color}" stroke-width="${S}" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${CX} ${CY})"/>`;
    offset += dash;
    return arc;
  }).join('');
  const legend = segs.map(s => `<div class="legend-row"><span class="legend-dot" style="background:${s.color}"></span><span class="legend-label">${s.label}</span><span class="legend-value">${s.value}</span></div>`).join('');
  return `
    <svg viewBox="0 0 200 200" width="100%" style="max-width:200px;display:block;margin:0 auto">
      <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#F0DDE2" stroke-width="${S}"/>
      ${arcs}
      <text x="${CX}" y="${CY - 2}" text-anchor="middle" font-size="26" font-weight="600" fill="#2B1B22">${total}</text>
      <text x="${CX}" y="${CY + 18}" text-anchor="middle" font-size="11" fill="#8A6B76">Sarees</text>
    </svg>
    <div class="legend">${legend}</div>`;
}

   AUTH SCREEN
   ========================================================================= */
function AuthScreen(forceReset){

        <div class="field"><label>Confirm password</label><input name="confirm" type="password" minlength="8" placeholder="Type it again" required autocomplete="new-password" /></div>

        <div class="field"><label>Password</label><input name="password" type="password" placeholder="Your password" required autocomplete="current-password" /></div>
        <button type="submit" class="btn btn-primary btn-block">Sign In</button>
      </form>
      <p class="auth-note"><a data-action="auth-tab" data-tab="forgot">Forgot your password?</a></p>
    `}
  </div></div>`;
}

/* =========================================================================
   DASHBOARD
   ========================================================================= */
function Dashboard(){
  const totalSarees = SAREES.length;
  const totalFavs = Object.values(FAVOURITE_COUNTS).reduce((s, n) => s + n, 0);
  const inStock = SAREES.filter(p => p.stock > 0).length;
  const outStock = SAREES.filter(p => p.stock <= 0).length;
  const ranked = [...SAREES].sort((a,b) => (FAVOURITE_COUNTS[b.id] || 0) - (FAVOURITE_COUNTS[a.id] || 0));

    { name:'Blush', c1:'#E8A0AE', c2:'#C2707F', gold:'#C9A961' },
    { name:'Ivory', c1:'#F1E5D5', c2:'#D8C3A5', gold:'#B98D4E' },
    { name:'Emerald', c1:'#1F5C4A', c2:'#0D3227', gold:'#D4B45F' },
    { name:'Mustard', c1:'#D9A441', c2:'#A9761C', gold:'#8C5E12' },
    { name:'Sage', c1:'#93AE93', c2:'#63836A', gold:'#C9A961' },
    { name:'Rani', c1:'#D6336C', c2:'#8E1B45', gold:'#E8C87A' },
    { name:'Lavender', c1:'#9B8AC4', c2:'#65569B', gold:'#D8C48A' },
    { name:'Teal', c1:'#0F7A7A', c2:'#064A4A', gold:'#D9B96A' }
  ];

  return `
  <div class="topbar"><div class="container inner">
    <div class="brand">
      <span class="logo-mini">${logoMarkup()}</span>
      <span class="dot"></span>
      Live · ${escapeHtml(SESSION?.user?.email || '')}
    </div>
    <div class="actions">
      <a href="file:///C:/Users/USER/Downloads/deepseek_html_20260920_b21073.html#/" target="_blank" class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.25)">View Store ↗</a>
      <button class="btn btn-danger btn-sm" data-action="signout">Sign out</button>
    </div>
  </div></div>

  <div class="wrap"><div class="container">

    <div class="stats">
      <div class="stat-card">
        <div class="ic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/></svg></div>
        <div class="lbl">Total Sarees</div>
        <div class="val">${totalSarees}</div>
        <div class="subl">${inStock} in stock · ${outStock} out</div>
      </div>
      <div class="stat-card highlight">
        <div class="ic">♥</div>
        <div class="lbl">Total Favourites</div>
        <div class="val">${totalFavs}</div>
        <div class="subl">Updates in real time</div>
      </div>
      <div class="stat-card">
        <div class="ic">🏆</div>
        <div class="lbl">Most Favourited</div>
        <div class="val" style="font-size:1rem;line-height:1.3">${topProduct ? escapeHtml(topProduct.name) : '—'}</div>
        <div class="subl">${topProduct ? (FAVOURITE_COUNTS[topProduct.id] || 0) + ' favourites' : 'No favourites yet'}</div>
      </div>
      <div class="stat-card">
        <div class="ic">👀</div>
        <div class="lbl">Untouched</div>
        <div class="val">${ranked.filter(s => !FAVOURITE_COUNTS[s.id]).length}</div>
        <div class="subl">Never favourited</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <h2><span class="dot"></span>Favourites — Live <span class="live-badge"><span class="pulse-dot"></span>Live</span></h2>
        <p class="sub">Every heart tapped on the public site updates this chart instantly.</p>
        ${renderFavouritesChart()}
      </div>
      <div class="chart-card">
        <h2><span class="dot"></span>Stock Availability</h2>
        <p class="sub">Current inventory health across your catalogue.</p>
        ${renderStockDonut()}
      </div>

        <div class="panel">

            <div class="save-bar" id="saveBar" style="display:none">

      ${SAREES.length ? `<div class="table-wrap"><table>

        <tbody>
                    ${SAREES.map(s => {
            const c = FAVOURITE_COUNTS[s.id] || 0;

                  ? `<button class="row-undo" data-action="undo-delete" data-id="${s.id}">Undo</button>`
                  : `<button class="icon-btn" data-action="delete-saree" data-id="${s.id}" title="Delete">
                      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></svg>
                    </button>`}
              </div></td>
            </tr>`;
          }).join('')}
        </tbody>
      </table></div>` : `<p style="color:var(--muted);font-size:.88rem">No sarees yet — add one below.</p>`}
    </div>

    <div class="panel">
      <h2><span class="dot"></span>Add a New Saree</h2>
      <p class="sub">New sarees appear on the public shop instantly.</p>
      <form data-form="add-saree" class="add-form">
        <div class="field"><label>Name *</label><input name="name" type="text" placeholder="e.g. Rosewood Kanjivaram" required /></div>
        <div class="field"><label>Category *</label><input name="category" type="text" placeholder="e.g. Kanjivaram" list="catList" required />
          <datalist id="catList">${Array.from(new Set(SAREES.map(s => s.category))).map(c => `<option value="${escapeHtml(c)}">`).join('')}</datalist>
        </div>
        <div class="field"><label>Fabric *</label><input name="fabric" type="text" placeholder="e.g. Pure Mulberry Silk" required /></div>
        <div class="field"><label>Weave / Origin</label><input name="weave" type="text" placeholder="e.g. Handwoven in Kanchipuram" /></div>
        <div class="field"><label>Price (₹) *</label><input name="price" type="number" min="0" required /></div>
        <div class="field"><label>MRP (₹) *</label><input name="mrp" type="number" min="0" required /></div>
        <div class="field"><label>Stock *</label><input name="stock" type="number" min="0" required /></div>
        <div class="field"><label>Starting Rating</label><input name="rating" type="number" min="1" max="5" step="0.1" value="4.5" /></div>
        <div class="field"><label>Best For</label><input name="occasion" type="text" placeholder="Wedding, Festive" /></div>
        <div class="field"><label>Blouse</label><input name="blouse" type="text" placeholder="Unstitched blouse piece included" /></div>
        <div class="field"><label>Care</label><input name="care" type="text" placeholder="Dry clean only" /></div>
        <div class="field"><label>Badge</label><input name="tag" type="text" placeholder="New / Bestseller / Bridal" /></div>
        <div class="field full"><label>Description *</label><textarea name="description" placeholder="Describe the saree…" required></textarea></div>
        <div class="field full">
          <label>Colour Palette *</label>
          <div class="palette-picker">
            ${palettes.map((opt, i) => `<button type="button" class="palette-swatch ${i === 0 ? 'active' : ''}" data-action="pick-palette" data-c1="${opt.c1}" data-c2="${opt.c2}" data-gold="${opt.gold}" style="--c1:${opt.c1};--c2:${opt.c2}" title="${opt.name}"></button>`).join('')}
          </div>
          <input type="hidden" name="c1" id="pC1" value="${palettes[0].c1}" />
          <input type="hidden" name="c2" id="pC2" value="${palettes[0].c2}" />
          <input type="hidden" name="gold" id="pGold" value="${palettes[0].gold}" />
        </div>
        <div class="field full"><button type="submit" class="btn btn-primary btn-block">+ Add Saree to Shop</button></div>
      </form>
    </div>

    <div class="panel">
      <h2><span class="dot"></span>Account</h2>
      <p class="sub">Signed in as <b>${escapeHtml(SESSION?.user?.email || '')}</b></p>
      <form data-form="change-password" style="max-width:420px">
        <div class="field"><label>New password</label><input name="password" type="password" minlength="8" placeholder="At least 8 characters" required autocomplete="new-password" /></div>
        <div class="field"><label>Confirm new password</label><input name="confirm" type="password" minlength="8" placeholder="Type it again" required autocomplete="new-password" /></div>
        <button type="submit" class="btn btn-ghost">Update Password</button>
      </form>
    </div>

  </div></div>`;
}

/* =========================================================================
   ACTIONS
   ========================================================================= */
function stageStock(id, value){
  const stock = Math.max(0, parseInt(value) || 0);
  const s = findSaree(id);
  if(!s) return;
  if(stock === s.stock){ delete PENDING.stock[id]; }
  else { PENDING.stock[id] = stock; }
  const input = document.querySelector(`.stock-input[data-id="${id}"]`);
  if(input){
    input.classList.remove('low','out','dirty');
    if(stock <= 0) input.classList.add('out');
    else if(stock <= 5) input.classList.add('low');
    if(PENDING.stock[id] !== undefined) input.classList.add('dirty');
  }
  updateSaveBar();
}

function stageDelete(id){
  const s = findSaree(id);
  if(!s) return;
  if(PENDING.deletes.has(id)) return;
  PENDING.deletes.add(id);
  render();
}

function unstageDelete(id){
  PENDING.deletes.delete(id);
  render();
}

async function savePendingChanges(){
  if(!SESSION) return;
  const btn = document.getElementById('saveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try {
    for(const [id, stock] of Object.entries(PENDING.stock)){
      const { error } = await sb.from('sarees').update({ stock }).eq('id', id);
      if(error) throw error;
    }
    for(const id of PENDING.deletes){
      const { error } = await sb.from('sarees').delete().eq('id', id);
      if(error) throw error;
    }
    const n = Object.keys(PENDING.stock).length + PENDING.deletes.size;
    PENDING = { stock:{}, deletes:new Set() };
    await loadSarees();
    await loadFavouriteCounts();
    render();
    toast(`${n} change${n === 1 ? '' : 's'} saved`, 'success');
  } catch(err){
    toast(err.message || 'Save failed', 'error');
    if(btn){ btn.disabled = false; btn.textContent = 'Save changes'; }
  }
}

function discardPendingChanges(){
  if(!confirm('Discard all unsaved changes?')) return;
  PENDING = { stock:{}, deletes:new Set() };
  render();
}

function hasPendingChanges(){
  return Object.keys(PENDING.stock).length > 0 || PENDING.deletes.size > 0;
}

function updateSaveBar(){
  const bar = document.getElementById('saveBar');
  if(!bar) return;
  const n = Object.keys(PENDING.stock).length + PENDING.deletes.size;
  const msg = document.getElementById('saveMsg');
  if(msg) msg.textContent = `● ${n} unsaved change${n === 1 ? '' : 's'}`;
  bar.style.display = n > 0 ? 'flex' : 'none';
}
async function addSaree(form){
  if(!SESSION) return;
  const fd = new FormData(form);
  const row = {
    name: (fd.get('name') || '').toString().trim(),
    category: (fd.get('category') || '').toString().trim(),
    fabric: (fd.get('fabric') || '').toString().trim(),
    weave: (fd.get('weave') || 'Handwoven').toString().trim(),
    price: Math.max(0, parseInt(fd.get('price')) || 0),
    mrp: Math.max(0, parseInt(fd.get('mrp')) || 0),
    stock: Math.max(0, parseInt(fd.get('stock')) || 0),
    rating: Math.min(5, Math.max(1, parseFloat(fd.get('rating')) || 4.5)),
    palette: [fd.get('c1'), fd.get('c2')],
    gold: fd.get('gold'),
    tag: (fd.get('tag') || '').toString().trim(),
    description: (fd.get('description') || '').toString().trim(),
    occasion: (fd.get('occasion') || 'Festive').toString().trim(),
    blouse: (fd.get('blouse') || 'Unstitched blouse piece included').toString().trim(),
    care: (fd.get('care') || 'Dry clean only').toString().trim()
  };
  if(!row.name || !row.category || !row.fabric){ toast('Name, category and fabric are required', 'error'); return; }
  const { error } = await sb.from('sarees').insert(row);
  if(error){ toast(error.message, 'error'); return; }
  await loadSarees();
  render();
  toast('✓ Saree added to shop', 'success');
}

/* =========================================================================
   RENDER
   ========================================================================= */
function render(){
  const app = document.getElementById('app');

  // Password reset redirect handler
  if(location.hash.includes('reset') && SESSION){
    app.innerHTML = AuthScreen(true);
    return;
  }

  if(!sb){
    app.innerHTML = `<div class="auth-wrap"><div class="auth-card">
      <div class="auth-logo">${logoMarkup()}</div>
      <h1>Setup required</h1>
      <p class="sub">Please configure your Supabase URL and anon key at the top of this file.</p>
    </div></div>`;
    return;
  }

  if(!SESSION){
    app.innerHTML = AuthScreen(false);
    return;
  }

  app.innerHTML = Dashboard();
  updateSaveBar();
}

/* =========================================================================
   TOAST
   ========================================================================= */
let toastTimer;
function toast(msg, type){
  const el = document.getElementById('toast');
  if(!el) return;
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* =========================================================================
   EVENTS
   ========================================================================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;
  if(a === 'auth-tab'){
    authTab = el.dataset.tab;
    authMsg = null;
    render();
    return;
  }
  if(a === 'signout'){ await signOut(); return; }
  if(a === 'delete-saree'){ stageDelete(el.dataset.id); return; }
  if(a === 'undo-delete'){ unstageDelete(el.dataset.id); return; }
  if(a === 'save-changes'){ await savePendingChanges(); return; }
  if(a === 'discard-changes'){ discardPendingChanges(); return; }
  if(a === 'pick-palette'){
    document.querySelectorAll('.palette-swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('pC1').value = el.dataset.c1;
    document.getElementById('pC2').value = el.dataset.c2;
    document.getElementById('pGold').value = el.dataset.gold;
  }
});

document.addEventListener('change', e => {
  if(e.target.matches('[data-action="update-stock"]')) stageStock(e.target.dataset.id, e.target.value);
});

document.addEventListener('input', e => {
  if(e.target.matches('[data-action="update-stock"]')){
    clearTimeout(e.target._t);
    e.target._t = setTimeout(() => stageStock(e.target.dataset.id, e.target.value), 300);
  }
});

document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const fd = new FormData(form);

  if(kind === 'signup'){
    const p = (fd.get('password') || '').toString();
    if(p.length < 8){ authMsg = { type:'error', text:'Password must be at least 8 characters.' }; render(); return; }
    await signUp(fd.get('email').toString().trim(), p);
    return;
  }
  if(kind === 'signin'){
    await signIn(fd.get('email').toString().trim(), fd.get('password').toString());
    return;
  }
  if(kind === 'reset-password'){
    await sendReset(fd.get('email').toString().trim());
    return;
  }
  if(kind === 'set-new-password'){
    const p = (fd.get('password') || '').toString();
    const c = (fd.get('confirm') || '').toString();
    if(p.length < 8){ toast('Password too short', 'error'); return; }
    if(p !== c){ toast('Passwords do not match', 'error'); return; }
    await changePassword(p);
    history.replaceState(null, '', location.pathname);
    location.reload();
    return;
  }
  if(kind === 'change-password'){
    const p = (fd.get('password') || '').toString();
    const c = (fd.get('confirm') || '').toString();
    if(p.length < 8){ toast('Password too short', 'error'); return; }
    if(p !== c){ toast('Passwords do not match', 'error'); return; }
    await changePassword(p);
    form.reset();
    return;
  }
  if(kind === 'add-saree'){
    await addSaree(form);
    form.reset();
    document.querySelectorAll('.palette-swatch')[0]?.click();
    return;
  }
});

/* =========================================================================
   INIT
   ========================================================================= */
(async function init(){
  if(!sb){ render(); return; }
  const isReset = await handleResetRedirect();
  await loadSession();
  if(SESSION){
    await loadSarees();
    await loadFavouriteCounts();
    subscribeRealtime();
  }
  render();

  // Session state changes (login, logout, token refresh)
  sb.auth.onAuthStateChange(async (_evt, session) => {
    SESSION = session;
    if(session){
      await loadSarees();
      await loadFavouriteCounts();
      subscribeRealtime();
    }
    render();
  });
})();
</script>
