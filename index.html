<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F7F3F5" />
<meta name="robots" content="noindex, nofollow" />
<title>Anchal — Owner Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Great+Vibes&family=Playfair+Display:ital@1&display=swap" rel="stylesheet">
<style>
:root{
  --rose:#A63D5C;--rose-dark:#7B2A45;--deep:#4A1428;--gold:#C9A961;--gold-soft:#E6D3A3;
  --cream:#FFFAF7;--blush:#FBEDF0;--blush-2:#F3D8E0;--pink:#EC3B7D;--ink:#2B1B22;
  --muted:#8A6B76;--line:#F0DDE2;--green:#1E7A5A;--red:#C8102E;--amber:#E08C2B;
  --radius:18px;--tap:44px;--maxw:1280px;
  --shadow:0 10px 30px -14px rgba(74,20,40,.28);
  --shadow-lg:0 28px 60px -24px rgba(74,20,40,.38);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font-family:'Poppins',system-ui,sans-serif;background:#F7F3F5;color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.18;font-weight:600;letter-spacing:-.015em}
p{margin:0}
.container{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 24px}
input,select,textarea{font-size:16px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 22px;border-radius:999px;border:1px solid transparent;font-size:.86rem;font-weight:500;cursor:pointer;transition:.25s;white-space:nowrap;min-height:var(--tap);touch-action:manipulation}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--rose);color:#fff}
.btn-primary:hover{background:var(--rose-dark)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--rose);color:var(--rose)}
.btn-danger{background:#fff;border-color:var(--line);color:var(--red)}
.btn-danger:hover{border-color:var(--red);background:#FFF5F5}
.btn-sm{padding:9px 16px;font-size:.78rem;min-height:38px}
.btn-block{width:100%}

.topbar{background:var(--deep);color:#fff;padding:14px 0;padding-top:calc(14px + env(safe-area-inset-top,0))}
.topbar .inner{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.topbar .brand{display:flex;align-items:center;gap:12px;font-size:.82rem;color:#E8B8C7;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.topbar .brand .dot{width:10px;height:10px;border-radius:50%;background:#4ADE80;box-shadow:0 0 0 4px rgba(74,222,128,.2);animation:pulse 2s infinite;flex:0 0 10px}
@keyframes pulse{0%,100%{box-shadow:0 0 0 4px rgba(74,222,128,.2)}50%{box-shadow:0 0 0 8px rgba(74,222,128,.05)}}
.topbar .brand .logo-mini{width:34px;height:34px;flex:0 0 34px}
.topbar .actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.wrap{padding:36px 0 80px}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;margin-bottom:22px}
.panel h2{font-size:1.08rem;margin-bottom:6px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--rose);flex:0 0 8px}
.panel .sub{color:var(--muted);font-size:.84rem;margin-bottom:22px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
.stat-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:22px;position:relative;overflow:hidden}
.stat-card .lbl{font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:10px}
.stat-card .val{font-size:1.9rem;font-weight:600;color:var(--deep);line-height:1}
.stat-card .subl{font-size:.76rem;color:var(--muted);margin-top:8px}
.stat-card .ic{position:absolute;top:18px;right:18px;width:38px;height:38px;border-radius:12px;background:var(--blush);display:grid;place-items:center;color:var(--rose);font-size:1rem}
.stat-card.highlight{background:linear-gradient(135deg,#4A1428,#7B2A45);color:#fff}
.stat-card.highlight .lbl,.stat-card.highlight .subl{color:#E8B8C7}
.stat-card.highlight .val{color:#fff}
.stat-card.highlight .ic{background:rgba(255,255,255,.14);color:var(--gold)}

.charts-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:22px;margin-bottom:22px}
.chart-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px;display:flex;flex-direction:column}
.chart-card h2{font-size:1.02rem;margin-bottom:4px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chart-card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--rose);flex:0 0 8px}
.live-badge{display:inline-flex;align-items:center;gap:6px;font-size:.66rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green);background:#E4F5EE;padding:4px 10px;border-radius:999px;margin-left:auto}
.live-badge .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 1.5s infinite}
.chart-card .sub{color:var(--muted);font-size:.8rem;margin-bottom:18px}
.chart-card svg text{font-family:'Poppins',sans-serif}

.lb-row{display:grid;grid-template-columns:minmax(140px,1.5fr) 1fr auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.lb-row:last-child{border-bottom:0}
.lb-name{font-size:.85rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-bar-wrap{background:var(--blush);border-radius:999px;height:12px;overflow:hidden;position:relative}
.lb-bar{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--rose),var(--pink));transition:width .8s cubic-bezier(.2,.7,.3,1);min-width:0}
.lb-count{font-size:.86rem;font-weight:600;color:var(--deep);min-width:44px;text-align:right}
.lb-count.zero{color:var(--muted);font-weight:400}
.untouched-pill{display:inline-block;background:#F1E5D5;color:#8C6A2E;font-size:.62rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;margin:3px 4px 0 0}

.legend{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.legend-row{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:.84rem}
.legend-dot{width:12px;height:12px;border-radius:3px}
.legend-label{color:var(--muted)}
.legend-value{font-weight:600;color:var(--deep)}

.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -8px}
table{width:100%;border-collapse:separate;border-spacing:0 8px;min-width:820px}
thead th{text-align:left;font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 14px;border-bottom:1px solid var(--line)}
tbody tr{background:var(--cream)}
tbody tr:hover{background:var(--blush)}
tbody td{padding:14px;font-size:.85rem;vertical-align:middle;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
tbody td:first-child{border-left:1px solid var(--line);border-top-left-radius:12px;border-bottom-left-radius:12px}
tbody td:last-child{border-right:1px solid var(--line);border-top-right-radius:12px;border-bottom-right-radius:12px}
.tbl-product{display:flex;align-items:center;gap:12px;min-width:200px}
.tbl-thumb{width:44px;height:56px;border-radius:8px;overflow:hidden;flex:0 0 44px;background:var(--blush)}
.tbl-thumb .saree-art{height:100%}
.tbl-info strong{display:block;font-weight:500;font-size:.86rem;line-height:1.3}
.tbl-info span{font-size:.72rem;color:var(--muted)}
.stock-input{width:72px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;text-align:center;font-size:.85rem;font-weight:500;outline:none;min-height:38px}
.stock-input:focus{border-color:var(--rose)}
.stock-input.low{border-color:var(--amber);background:#FFF8EE}
.stock-input.out{border-color:var(--red);background:#FFF0F2;color:var(--red)}
.stock-input.dirty{border-color:var(--rose);background:#FFF5F8;box-shadow:0 0 0 3px rgba(166,61,92,.08)}
.fav-cell{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--deep)}
.fav-cell.zero{color:var(--muted);font-weight:400}
.fav-cell .heart-ic{color:var(--pink)}
.row-actions{display:flex;gap:6px;justify-content:flex-end}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--muted);display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{border-color:var(--red);color:var(--red);background:#FFF5F5}
.icon-btn.edit:hover{border-color:var(--rose);color:var(--rose);background:var(--blush)}
.row-undo{background:transparent;border:1px solid var(--line);color:var(--rose);border-radius:8px;padding:6px 12px;font-size:.72rem;font-weight:500;cursor:pointer;font-family:inherit;transition:.2s}
.row-undo:hover{background:var(--blush);border-color:var(--rose)}
tbody tr.staged-delete{background:#FFF0F2}
tbody tr.staged-delete td{opacity:.5}
tbody tr.staged-delete .tbl-info strong{text-decoration:line-through}

/* ====== INVENTORY COUNT BADGE ====== */
.inv-count{
  font-size:.68rem;
  font-weight:600;
  color:var(--muted);
  background:var(--blush);
  padding:3px 10px;
  border-radius:999px;
  letter-spacing:.02em;
  margin-left:4px;
}

/* ====== SORTABLE HEADERS ====== */
thead th.sortable{
  cursor:pointer;
  user-select:none;
  transition:color .15s;
  white-space:nowrap;
}
thead th.sortable:hover{color:var(--rose)}
thead th.sortable.active{color:var(--rose)}
.sort-icon{
  display:inline-block;
  font-size:.72em;
  opacity:.35;
  margin-left:5px;
  transition:opacity .15s;
}
thead th.sortable:hover .sort-icon,
thead th.sortable.active .sort-icon{opacity:1}

/* ====== INVENTORY SHOW MORE ====== */
.inv-more-wrap{
  display:flex;
  justify-content:center;
  padding:22px 0 6px;
  margin-top:8px;
  border-top:1px solid var(--line);
}
.inv-more-wrap .btn{
  display:inline-flex;
  align-items:center;
  gap:10px;
  padding:11px 24px;
  font-size:.84rem;
}
.inv-more-count{
  font-size:.7rem;
  font-weight:500;
  color:var(--muted);
  background:var(--blush);
  padding:3px 9px;
  border-radius:999px;
  letter-spacing:.02em;
}
.inv-more-wrap .btn:hover .inv-more-count{background:var(--blush-2);color:var(--rose)}

/* ====== INVENTORY EMPTY STATE ====== */
.inv-empty{
  display:none;
  text-align:center;
  padding:56px 24px 60px;
  color:var(--muted);
}
.inv-empty.show{display:block}
.inv-empty .empty-illustration{
  width:180px;
  height:140px;
  margin:0 auto 20px;
  display:block;
}
.inv-empty .empty-title{
  font-size:1.05rem;
  font-weight:600;
  color:var(--ink);
  margin-bottom:6px;
  letter-spacing:-.01em;
}
.inv-empty .empty-sub{
  font-size:.86rem;
  color:var(--muted);
  line-height:1.55;
  max-width:340px;
  margin:0 auto 20px;
}
.inv-empty .empty-reset{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:10px 22px;
  border-radius:999px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--rose);
  font-size:.82rem;
  font-weight:500;
  font-family:inherit;
  cursor:pointer;
  transition:.2s;
}
.inv-empty .empty-reset:hover{
  border-color:var(--rose);
  background:var(--blush);
  transform:translateY(-1px);
}

/* ====== SAVE BAR ====== */
.save-bar{display:flex;align-items:center;gap:12px;background:#FFF8EE;border:1px solid #F0D9B5;border-radius:12px;padding:12px 16px;margin-bottom:16px;flex-wrap:wrap}
.save-bar .msg{color:#8C6A2E;font-size:.86rem;font-weight:500;flex:1;min-width:180px}
.save-bar .actions{display:flex;gap:8px;flex-wrap:wrap}

.add-form{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}
.add-form .field{margin-bottom:16px}
.add-form .field.full{grid-column:1/-1}
.field label{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;padding:12px 16px;border-radius:12px;border:1px solid var(--line);background:var(--cream);outline:none;font-size:16px;min-height:var(--tap);font-family:inherit}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--rose);background:#fff}
.field textarea{resize:vertical;min-height:90px}
.palette-picker{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px}
.palette-swatch{width:44px;height:44px;border-radius:12px;border:2px solid transparent;cursor:pointer;position:relative;overflow:hidden;padding:0;background:none}
.palette-swatch::after{content:'';position:absolute;inset:0;border-radius:10px;background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%)}
.palette-swatch.active{border-color:var(--rose);transform:scale(1.06)}
.palette-swatch.active::before{content:'✓';position:absolute;bottom:-3px;right:-3px;width:18px;height:18px;border-radius:50%;background:var(--rose);color:#fff;font-size:.6rem;font-weight:700;display:grid;place-items:center;z-index:2;border:2px solid #fff}

/* ====== PRODUCT TYPE SELECTOR (Add form) ====== */
.type-selector{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.type-btn{
  padding:22px 16px;
  border-radius:16px;
  border:2px solid var(--line);
  background:#fff;
  font-size:1.05rem;
  font-weight:600;
  letter-spacing:.02em;
  color:var(--muted);
  cursor:pointer;
  font-family:inherit;
  position:relative;
  transition:all .25s cubic-bezier(.2,.7,.3,1);
  min-height:68px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}
.type-btn:hover{
  border-color:var(--blush-2);
  color:var(--rose);
  transform:translateY(-2px);
  box-shadow:0 10px 22px -14px rgba(74,20,40,.22);
}
.type-btn.active{
  border-color:var(--rose);
  background:linear-gradient(135deg,#FFF5F8,#FCE9EF);
  color:var(--rose);
  box-shadow:0 10px 26px -14px rgba(166,61,92,.4);
}

/* ====== LOCKED PRODUCT TYPE (Edit modal) ====== */
.type-locked{
  display:flex;
  align-items:center;
  gap:12px;
  padding:16px 20px;
  border-radius:16px;
  background:linear-gradient(135deg,#FFF5F8,#FCE9EF);
  border:1.5px solid var(--blush-2);
  color:var(--rose);
  font-size:1.05rem;
  font-weight:600;
  letter-spacing:.02em;
  min-height:60px;
}
.type-locked .lock-icon{
  width:20px;
  height:20px;
  flex:0 0 20px;
  opacity:.55;
  color:var(--rose);
}
.type-locked .lbl{flex:1}
.type-locked .tag-readonly{
  font-size:.6rem;
  font-weight:700;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:var(--muted);
  background:#fff;
  border:1px solid var(--line);
  padding:3px 9px;
  border-radius:999px;
}
.type-locked-hint{
  font-size:.72rem;
  color:var(--muted);
  margin-top:8px;
  line-height:1.5;
}

/* ====== SIZE CHIPS — CLEAN PILLS ====== */
.size-chips{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}
.size-chip{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:0 24px;
  height:46px;
  min-width:62px;
  border:1.5px solid var(--line);
  border-radius:999px;
  background:#fff;
  font-size:.9rem;
  font-weight:500;
  color:var(--ink);
  cursor:pointer;
  transition:all .2s cubic-bezier(.2,.7,.3,1);
  user-select:none;
  letter-spacing:.04em;
  font-family:inherit;
}
.size-chip:hover{
  border-color:var(--rose);
  color:var(--rose);
  transform:translateY(-1px);
}
.size-chip input{display:none}
.size-chip.active{
  background:var(--rose);
  border-color:var(--rose);
  color:#fff;
  font-weight:600;
  box-shadow:0 6px 16px -6px rgba(166,61,92,.55);
}
.size-chip.active:hover{background:var(--rose-dark);border-color:var(--rose-dark)}

/* ====== MULTI-IMAGE UPLOADER ====== */
.image-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:14px;
  margin-top:12px;
}
.image-tile{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
  position:relative;
  display:flex;
  flex-direction:column;
  transition:box-shadow .2s, border-color .2s;
}
.image-tile:hover{box-shadow:0 6px 20px -10px rgba(74,20,40,.3)}
.image-tile .thumb{
  aspect-ratio:3/4;
  background:var(--blush);
  overflow:hidden;
  position:relative;
}
.image-tile .thumb img{
  width:100%;height:100%;
  object-fit:cover;display:block;
}
.image-tile .thumb .remove{
  position:absolute;top:8px;right:8px;
  width:30px;height:30px;border-radius:50%;
  background:rgba(255,255,255,.96);color:var(--red);
  border:0;cursor:pointer;display:grid;place-items:center;
  box-shadow:0 2px 8px -2px rgba(0,0,0,.35);
  font-size:1rem;line-height:1;font-family:inherit;
  transition:.15s;
  z-index:2;
}
.image-tile .thumb .remove:hover{background:var(--red);color:#fff;transform:scale(1.08)}
.image-tile .thumb .primary-tag{
  position:absolute;top:8px;left:8px;
  background:var(--rose);color:#fff;
  font-size:.6rem;font-weight:700;letter-spacing:.1em;
  padding:4px 9px;border-radius:999px;
  text-transform:uppercase;z-index:2;
  box-shadow:0 2px 8px -2px rgba(166,61,92,.5);
}
.image-tile .meta{
  padding:10px 12px 12px;
  display:flex;flex-direction:column;gap:8px;
}
.image-tile .color-row{display:flex;align-items:center;gap:9px}
.image-tile .color-dot{
  width:22px;height:22px;border-radius:50%;
  border:2px solid #fff;
  box-shadow:0 0 0 1.5px var(--line);
  flex:0 0 22px;
}
.image-tile .color-hex{
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:.72rem;color:var(--muted);
  letter-spacing:.04em;font-weight:500;
}
.image-tile .color-name{
  width:100%;padding:8px 10px;border-radius:8px;
  border:1px solid var(--line);background:var(--cream);
  outline:none;font-size:.8rem;font-family:inherit;
  min-height:36px;transition:.15s;
}
.image-tile .color-name:focus{border-color:var(--rose);background:#fff}
.image-tile.add-tile{
  display:flex;align-items:center;justify-content:center;
  border:1.5px dashed var(--line);
  cursor:pointer;aspect-ratio:3/4;
  color:var(--rose);font-size:.82rem;font-weight:500;
  text-align:center;padding:18px;
  background:#fff;transition:.2s;
}
.image-tile.add-tile:hover{
  border-color:var(--rose);background:#FFF5F8;
  transform:scale(1.02);
}
.image-tile.add-tile .plus{
  font-size:2.4rem;line-height:1;margin-bottom:8px;
  color:var(--rose);font-weight:300;
}
.image-tile.add-tile .lbl-main{font-weight:600;margin-bottom:4px}
.image-tile.add-tile .lbl-sub{font-size:.68rem;color:var(--muted);font-weight:400;line-height:1.35}

.image-hint{
  font-size:.74rem;color:var(--muted);
  margin-top:6px;line-height:1.55;
}
.extracting{
  position:absolute;inset:0;display:grid;place-items:center;
  background:rgba(255,255,255,.9);
  font-size:.72rem;color:var(--rose);font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;
  z-index:1;
}
.extracting::before{
  content:'';
  width:18px;height:18px;border-radius:50%;
  border:2px solid var(--blush-2);border-top-color:var(--rose);
  animation:spin 0.8s linear infinite;
  position:absolute;top:calc(50% - 26px);left:50%;margin-left:-9px;
}
@keyframes spin{to{transform:rotate(360deg)}}

.color-stack{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
.color-stack .dot{
  width:16px;height:16px;border-radius:50%;
  border:1.5px solid #fff;box-shadow:0 0 0 1px var(--line);
}
.color-stack .more{
  font-size:.68rem;color:var(--muted);
  background:var(--blush);padding:1px 6px;border-radius:999px;
  font-weight:500;
}

/* ====== AUTH ====== */

/* =========================================================================
   COLOUR EXTRACTION
   ========================================================================= */
function extractDominantColor(file){
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      try{
        const W = 120, H = 120;
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        ctx.drawImage(img, 0, 0, W, H);
        const data = ctx.getImageData(0, 0, W, H).data;

        const buckets = {};
        for(let i = 0; i < data.length; i += 4){
          const r = data[i], g = data[i+1], b = data[i+2], a = data[i+3];
          if(a < 200) continue;
          const max = Math.max(r, g, b), min = Math.min(r, g, b);
          const l = (max + min) / 2;
          if(l > 235 || l < 25) continue;
          const d = max - min;
          const sat = max === 0 ? 0 : d / max;
          if(sat < 0.15) continue;
          const key = (Math.round(r/32)*32) + ',' + (Math.round(g/32)*32) + ',' + (Math.round(b/32)*32);
          buckets[key] = (buckets[key] || 0) + 1;
        }

        let bestKey = null, bestCount = 0;
        for(const k in buckets){
          if(buckets[k] > bestCount){ bestCount = buckets[k]; bestKey = k; }
        }

        if(!bestKey){
          resolve({ hex: '#CCCCCC', name: 'Custom' });
          return;
        }
        const [r, g, b] = bestKey.split(',').map(n => Math.min(255, parseInt(n)));
        const hex = '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('').toUpperCase();
        resolve({ hex, name: nameForHex(hex) });
      } catch(err){
        resolve({ hex: '#CCCCCC', name: 'Custom' });
      }
    };
    img.onerror = () => resolve({ hex: '#CCCCCC', name: 'Custom' });
    img.src = URL.createObjectURL(file);
  });
}

function nameForHex(hex){
  const m = hex.replace('#','');
  const r = parseInt(m.slice(0,2), 16);
  const g = parseInt(m.slice(2,4), 16);
  const b = parseInt(m.slice(4,6), 16);
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  const d = max - min;
  const l = (max + min) / 2;
  let h = 0;
  if(d !== 0){
    if(max === r) h = ((g - b) / d) % 6;
    else if(max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h = Math.round(h * 60);
    if(h < 0) h += 360;
  }
  const s = max === 0 ? 0 : d / max;
  if(l < 35) return 'Black';
  if(l > 225 && s < 0.12) return 'White';
  if(s < 0.13){
    if(l < 90) return 'Charcoal';
    if(l < 175) return 'Grey';
    return 'Ivory';
  }
  const light = l > 170;
  const dark = l < 95;
  if(h < 15 || h >= 345) return dark ? 'Maroon' : light ? 'Blush' : 'Red';
  if(h < 30)  return light ? 'Peach'  : dark ? 'Brick'   : 'Orange';
  if(h < 45)  return light ? 'Apricot': dark ? 'Amber'   : 'Mustard';
  if(h < 65)  return light ? 'Cream'  : dark ? 'Ochre'   : 'Gold';
  if(h < 90)  return light ? 'Pale Yellow' : dark ? 'Olive' : 'Yellow';
  if(h < 150) return light ? 'Mint'   : dark ? 'Forest'  : 'Green';
  if(h < 175) return light ? 'Seafoam': dark ? 'Emerald' : 'Sage';
  if(h < 195) return light ? 'Aqua'   : dark ? 'Teal'    : 'Turquoise';
  if(h < 225) return light ? 'Sky'    : dark ? 'Navy'    : 'Ocean';
  if(h < 250) return light ? 'Powder Blue' : dark ? 'Indigo' : 'Royal Blue';
  if(h < 280) return light ? 'Lilac'  : dark ? 'Plum'    : 'Violet';
  if(h < 305) return light ? 'Mauve'  : dark ? 'Aubergine' : 'Purple';
  if(h < 330) return light ? 'Blush'  : dark ? 'Wine'    : 'Rose';
  return light ? 'Pink' : dark ? 'Deep Pink' : 'Rani Pink';
}

/* =========================================================================
   IMAGE HELPERS
   ========================================================================= */
function makeId(){ return 'img_' + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }

async function addImagesFromFiles(files, target){
  const list = target === 'add' ? ADD_IMAGES : EDIT_IMAGES;
  const arr = Array.from(files || []);
  if(!arr.length) return;

  const existing = new Set(list.map(x => x.file ? (x.file.name + '::' + x.file.size) : ''));
  const fresh = arr.filter(f => f.type.startsWith('image/') && !existing.has(f.name + '::' + f.size));
  if(!fresh.length){
    toast('Those photos are already added');
    return;
  }

  for(const file of fresh){
    const _id = makeId();
    const previewUrl = URL.createObjectURL(file);
    const item = { _id, file, previewUrl, url: null, hex: null, name: '', _extracting: true };
    list.push(item);
  }
  updateImagesGrid(target);

  for(let i = 0; i < fresh.length; i++){
    const file = fresh[i];
    const item = list[list.length - fresh.length + i];
    try{
      const { hex, name } = await extractDominantColor(file);
      item.hex = hex;
      item.name = name;
      item._extracting = false;
    } catch(e){
      item.hex = '#CCCCCC';
      item.name = 'Colour';
      item._extracting = false;
    }
    updateImagesGrid(target);
  }
}

function removeImage(target, _id){
  const list = target === 'add' ? ADD_IMAGES : EDIT_IMAGES;
  const idx = list.findIndex(x => x._id === _id);
  if(idx === -1) return;
  const item = list[idx];
  if(item.previewUrl) URL.revokeObjectURL(item.previewUrl);
  list.splice(idx, 1);
  updateImagesGrid(target);
}

function updateImageName(target, _id, name){
  const list = target === 'add' ? ADD_IMAGES : EDIT_IMAGES;
  const item = list.find(x => x._id === _id);
  if(item) item.name = name;
}

async function uploadAllImages(list){
  const out = [];
  for(const item of list){
    if(item.url){
      out.push({ url: item.url, hex: item.hex || '#CCCCCC', name: item.name || 'Colour' });
      continue;
    }
    try{
      const url = await uploadSareePhoto(item.file);
      out.push({ url, hex: item.hex || '#CCCCCC', name: item.name || 'Colour' });
    } catch(err){
      console.error('Upload failed', err);
    }
  }
  return out;
}

function updateImagesGrid(target){
  const formId = target === 'add' ? 'addForm' : 'editSareeForm';
  const form = document.getElementById(formId);
  if(!form) return;
  const list = target === 'add' ? ADD_IMAGES : EDIT_IMAGES;
  const oldGrid = form.querySelector('.image-grid');
  if(!oldGrid) return;

  const temp = document.createElement('div');
  temp.innerHTML = renderImagesBlock(list, target);
  const newGrid = temp.firstElementChild;

  oldGrid.replaceWith(newGrid);
}

function itemPreview(item){
  return item.previewUrl || item.url || '';
}

function renderImageTile(item, target, isPrimary){
  const extracting = item._extracting;
  const src = itemPreview(item);
  return `
    <div class="image-tile">
      <div class="thumb">
        ${src ? `<img src="${src}" alt="" />` : ''}
        ${isPrimary ? `<span class="primary-tag">Primary</span>` : ''}
        <button type="button" class="remove" data-action="remove-image" data-target="${target}" data-imgid="${item._id}" title="Remove">×</button>
        ${extracting ? `<div class="extracting">Detecting colour…</div>` : ''}
      </div>
      <div class="meta">
        <div class="color-row">
          <span class="color-dot" style="background:${item.hex || '#EEEEEE'}"></span>
          <span class="color-hex">${escapeHtml(item.hex || '—')}</span>
        </div>
        <input type="text" class="color-name" placeholder="Colour name"
               value="${escapeHtml(item.name || '')}"
               data-action="image-name" data-target="${target}" data-imgid="${item._id}" />
      </div>
    </div>`;
}

function renderImagesBlock(list, target){
  const tiles = list.map((item, i) => renderImageTile(item, target, i === 0)).join('');
  return `
    <div class="image-grid">
      ${tiles}
      <label class="image-tile add-tile">
        <div>
          <div class="plus">+</div>
          <div class="lbl-main">Add photos</div>
          <div class="lbl-sub">Select one or many at once</div>
        </div>
        <input type="file" accept="image/*" multiple
               data-action="add-images" data-target="${target}"
               style="display:none" />
      </label>
    </div>`;
}

   ========================================================================= */
async function loadSarees(){
  const { data } = await sb.from('sarees').select('*').order('created_at', { ascending: false });
  SAREES = (data || []).map(p => ({
    ...p,
    palette: normalizeJson(p.palette, []),
    sizes:   normalizeJson(p.sizes, []),
    images:  normalizeJson(p.images, [])
  }));
}
async function loadFavouriteCounts(){
  const [favRes, waRes, actRes] = await Promise.all([
    sb.from('favourites').select('saree_id, created_at'),
    sb.from('whatsapp_enquiries').select('saree_id, created_at'),
    sb.from('activity_log').select('id, saree_id, event_type, created_at')
      .order('created_at', { ascending: false }).limit(200)
  ]);
  FAV_EVENTS = favRes.data || [];
  WA_EVENTS = waRes.data || [];
  ACTIVITY = actRes.data || [];
  const counts = {};
  FAV_EVENTS.forEach(r => { counts[r.saree_id] = (counts[r.saree_id] || 0) + 1; });
  FAVOURITE_COUNTS = counts;
}
async function loadSession(){
  const { data: { session } } = await sb.auth.getSession();
  SESSION = session;
}

/* =========================================================================
   AUTH
   ========================================================================= */
async function signUp(email, password){
  authMsg = null;
  const { error } = await sb.auth.signUp({ email, password });
  if(error){ authMsg = { type:'error', text: error.message }; return; }
  const { error: e2 } = await sb.auth.signInWithPassword({ email, password });
  if(e2){ authMsg = { type:'info', text: 'Account created. Please check your email to confirm, then sign in.' }; authTab = 'signin'; return; }
  await loadSession();
  render();
}
async function signIn(email, password){
  authMsg = null;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ authMsg = { type:'error', text: error.message }; render(); return; }
  await loadSession();
  await loadSarees();
  await loadFavouriteCounts();
  subscribeRealtime();
  render();
}
async function signOut(){
  await sb.auth.signOut();
  if(liveChannel){ sb.removeChannel(liveChannel); liveChannel = null; }
  SESSION = null;
  render();
}
async function sendReset(email){
  authMsg = null;
  const { error } = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: window.location.origin + window.location.pathname + '#reset'
  });
  if(error){ authMsg = { type:'error', text: error.message }; render(); return; }
  authMsg = { type:'success', text: 'Reset link sent. Check your inbox and follow the link to set a new password.' };
  render();
}
async function changePassword(newPassword){
  authMsg = null;
  const { error } = await sb.auth.updateUser({ password: newPassword });
  if(error){ toast(error.message, 'error'); return; }
  toast('Password updated successfully', 'success');
}
async function handleResetRedirect(){
  if(!location.hash.includes('reset')) return false;
  await loadSession();
  return !!SESSION;
}

/* =========================================================================
   REALTIME
   ========================================================================= */
function subscribeRealtime(){
  if(liveChannel) return;
  liveChannel = sb.channel('admin_live')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'favourites' }, async () => {
      await loadFavouriteCounts(); render();
    })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'whatsapp_enquiries' }, async () => {
      await loadFavouriteCounts(); render();
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'activity_log' }, async () => {
      await loadFavouriteCounts(); render();
    })
    .subscribe();
}

function renderFavouritesChart(){
  const ranked = [...SAREES].sort((a,b) => (FAVOURITE_COUNTS[b.id] || 0) - (FAVOURITE_COUNTS[a.id] || 0));
  const max = Math.max(1, ...ranked.map(s => FAVOURITE_COUNTS[s.id] || 0));
  const untouched = ranked.filter(s => !FAVOURITE_COUNTS[s.id]);
  const total = Object.values(FAVOURITE_COUNTS).reduce((s, n) => s + n, 0);
  if(SAREES.length === 0){
    return `<div style="text-align:center;padding:40px;color:var(--muted);font-size:.86rem">Add products to see favourites.</div>`;
  }
  return `
    <div style="margin-bottom:18px;display:flex;gap:26px;flex-wrap:wrap">
      <div><span style="font-size:1.7rem;font-weight:600;color:var(--deep);line-height:1">${total}</span><div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px">Total Favourites</div></div>
      <div><span style="font-size:1.7rem;font-weight:600;color:var(--deep);line-height:1">${ranked[0] && (FAVOURITE_COUNTS[ranked[0].id] || 0) > 0 ? ranked[0].name : '—'}</span><div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px">Top Favourite</div></div>
      <div><span style="font-size:1.7rem;font-weight:600;color:var(--deep);line-height:1">${untouched.length}</span><div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px">Never Favourited</div></div>
    </div>
    <div>
      ${ranked.map(s => {
        const c = FAVOURITE_COUNTS[s.id] || 0;
        const pct = c > 0 ? Math.max(5, (c / max) * 100) : 0;
        return `<div class="lb-row">
          <div class="lb-name" title="${escapeHtml(s.name)}">${escapeHtml(s.name)}</div>
          <div class="lb-bar-wrap"><div class="lb-bar" style="width:${pct}%"></div></div>
          <div class="lb-count ${c === 0 ? 'zero' : ''}">${c}</div>
        </div>`;
      }).join('')}
    </div>`;
}

function renderStockDonut(){
  const inStock = SAREES.filter(p => p.stock > 5).length;
  const low = SAREES.filter(p => p.stock > 0 && p.stock <= 5).length;
  const out = SAREES.filter(p => p.stock <= 0).length;
  const total = SAREES.length;
  if(total === 0) return `<div style="text-align:center;padding:40px;color:var(--muted);font-size:.86rem">No products yet.</div>`;
  const segs = [
    { label:'In Stock', value:inStock, color:'#1E7A5A' },
    { label:'Low Stock', value:low, color:'#E08C2B' },
    { label:'Out of Stock', value:out, color:'#C8102E' }
  ];
  const R = 70, CX = 100, CY = 100, S = 26;
  const circ = 2 * Math.PI * R;
  let offset = 0;
  const arcs = segs.map(s => {
    if(s.value === 0) return '';
    const dash = (s.value / total) * circ;
    const gap = circ - dash;
    const arc = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${s.color}" stroke-width="${S}" stroke-dasharray="${dash.toFixed(2)} ${gap.toFixed(2)}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${CX} ${CY})"/>`;
    offset += dash;
    return arc;
  }).join('');
  const legend = segs.map(s => `<div class="legend-row"><span class="legend-dot" style="background:${s.color}"></span><span class="legend-label">${s.label}</span><span class="legend-value">${s.value}</span></div>`).join('');
  return `
    <svg viewBox="0 0 200 200" width="100%" style="max-width:200px;display:block;margin:0 auto">
      <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#F0DDE2" stroke-width="${S}"/>
      ${arcs}
      <text x="${CX}" y="${CY - 2}" text-anchor="middle" font-size="26" font-weight="600" fill="#2B1B22">${total}</text>
      <text x="${CX}" y="${CY + 18}" text-anchor="middle" font-size="11" fill="#8A6B76">Products</text>
    </svg>
    <div class="legend">${legend}</div>`;
}

function renderEnquiryTrendChart(){
  const days = 14;
  const dayMs = 86400000;
  const nowEnd = new Date();
  nowEnd.setHours(23,59,59,999);
  const nowTs = nowEnd.getTime();
  const favBuckets = Array(days).fill(0);
  const waBuckets = Array(days).fill(0);
  const labels = [];
  for(let i = days - 1; i >= 0; i--){
    const d = new Date(nowTs - i * dayMs);
    labels.push(d.toLocaleDateString('en-IN', { day:'numeric', month:'short' }));
  }
  FAV_EVENTS.forEach(e => {
    const ts = new Date(e.created_at).getTime();
    const idx = days - 1 - Math.floor((nowTs - ts) / dayMs);
    if(idx >= 0 && idx < days) favBuckets[idx]++;
  });
  WA_EVENTS.forEach(e => {
    const ts = new Date(e.created_at).getTime();
    const idx = days - 1 - Math.floor((nowTs - ts) / dayMs);
    if(idx >= 0 && idx < days) waBuckets[idx]++;
  });
  const totalFav = favBuckets.reduce((s,n) => s+n, 0);
  const totalWa = waBuckets.reduce((s,n) => s+n, 0);
  const hasData = totalFav + totalWa > 0;
  const legend = `
    <div style="display:flex;gap:22px;flex-wrap:wrap;margin-bottom:16px">
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:14px;height:14px;border-radius:4px;background:#A63D5C"></span>
        <span style="font-size:.82rem;color:var(--muted)">Favourites</span>
        <b style="font-size:.9rem;color:var(--deep);margin-left:2px">${totalFav}</b>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span style="width:14px;height:14px;border-radius:4px;background:#25D366"></span>
        <span style="font-size:.82rem;color:var(--muted)">WhatsApp enquiries</span>
        <b style="font-size:.9rem;color:var(--deep);margin-left:2px">${totalWa}</b>
      </div>
    </div>`;
  if(!hasData){
    return legend + `<div style="text-align:center;padding:36px 20px;color:var(--muted);font-size:.86rem">
      <div style="font-size:2rem;margin-bottom:8px">📈</div>
      No activity yet — the line will appear as customers favourite and enquire.
    </div>`;
  }
  const W = 720, H = 260;
  const PAD_L = 44, PAD_R = 22, PAD_T = 24, PAD_B = 40;
  const chartW = W - PAD_L - PAD_R;
  const chartH = H - PAD_T - PAD_B;
  const maxVal = Math.max(...favBuckets, ...waBuckets, 1);
  const niceMax = [4,8,12,16,20,24,32,40,60,100].find(c => c >= maxVal) || 100;
  const stepX = chartW / (days - 1);
  const makePoints = arr => arr.map((v, i) => ({ x: PAD_L + i * stepX, y: PAD_T + chartH - (v / niceMax) * chartH, v }));
  const favPts = makePoints(favBuckets);
  const waPts = makePoints(waBuckets);
  const buildPath = pts => pts.map((p,i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ' ' + p.y.toFixed(1)).join(' ');
  const gridLines = [0,.25,.5,.75,1].map(f => {
    const y = PAD_T + chartH * (1 - f);
    const val = Math.round(niceMax * f);
    return `<line x1="${PAD_L}" y1="${y}" x2="${PAD_L + chartW}" y2="${y}" stroke="#F0DDE2" stroke-dasharray="3 4"/>
            <text x="${PAD_L - 8}" y="${y + 4}" text-anchor="end" font-size="10" fill="#8A6B76">${val}</text>`;
  }).join('');
  const xLabels = labels.map((lbl, i) => {
    if(i % 2 !== 0 && i !== labels.length - 1) return '';
    return `<text x="${favPts[i].x}" y="${H - 12}" text-anchor="middle" font-size="10" fill="#8A6B76">${lbl}</text>`;
  }).join('');
  const favDots = favPts.map(p => p.v > 0 ? `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="#A63D5C" stroke-width="2"><title>${p.v} favourites</title></circle>` : '').join('');
  const waDots = waPts.map(p => p.v > 0 ? `<circle cx="${p.x}" cy="${p.y}" r="3.5" fill="#fff" stroke="#25D366" stroke-width="2"><title>${p.v} enquiries</title></circle>` : '').join('');
  return legend + `
    <svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;overflow:visible">
      ${gridLines}
      <path d="${buildPath(favPts)}" fill="none" stroke="#A63D5C" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${buildPath(waPts)}" fill="none" stroke="#25D366" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${favDots}${waDots}${xLabels}
    </svg>
    <p style="margin-top:12px;font-size:.76rem;color:var(--muted);text-align:center">Last 14 days · updates live</p>`;
}

function renderTimeline(){
  let items = ACTIVITY.slice();
  if(TIMELINE_FILTER === 'added') items = items.filter(x => x.event_type === 'favourite_added');
  else if(TIMELINE_FILTER === 'removed') items = items.filter(x => x.event_type === 'favourite_removed');
  else if(TIMELINE_FILTER === 'enquiry') items = items.filter(x => x.event_type === 'whatsapp_enquiry');
  const countAll     = ACTIVITY.length;
  const countAdded   = ACTIVITY.filter(x => x.event_type === 'favourite_added').length;
  const countRemoved = ACTIVITY.filter(x => x.event_type === 'favourite_removed').length;
  const countWa      = ACTIVITY.filter(x => x.event_type === 'whatsapp_enquiry').length;
  const chips = `
    <div class="tl-filters">
      <button class="tl-chip ${TIMELINE_FILTER === 'all' ? 'active' : ''}" data-action="tl-filter" data-filter="all">All activity <span class="cnt">${countAll}</span></button>
      <button class="tl-chip ${TIMELINE_FILTER === 'added' ? 'active' : ''}" data-action="tl-filter" data-filter="added">♥ Added <span class="cnt">${countAdded}</span></button>
      <button class="tl-chip ${TIMELINE_FILTER === 'removed' ? 'active' : ''}" data-action="tl-filter" data-filter="removed">♡ Removed <span class="cnt">${countRemoved}</span></button>
      <button class="tl-chip ${TIMELINE_FILTER === 'enquiry' ? 'active' : ''}" data-action="tl-filter" data-filter="enquiry">💬 WhatsApp <span class="cnt">${countWa}</span></button>
    </div>`;
  if(items.length === 0){
    const emptyMessage = TIMELINE_FILTER === 'all'
      ? { icon: '📭', title: 'No activity yet', sub: 'As customers browse your collection, their favourites and enquiries will appear here in real time.' }
      : TIMELINE_FILTER === 'added'
        ? { icon: '♡', title: 'No favourites yet', sub: 'When someone saves a product, it will show up here.' }
        : TIMELINE_FILTER === 'removed'
          ? { icon: '✦', title: 'Nothing removed', sub: "Customers haven't removed any favourites from their wishlist." }
          : { icon: '💬', title: 'No WhatsApp enquiries yet', sub: 'Once someone taps WhatsApp on the store, the enquiry will appear here.' };
    return chips + `
      <div class="tl-empty">
        <span class="tl-empty-icon">${emptyMessage.icon}</span>
        <div class="tl-empty-title">${emptyMessage.title}</div>
        <p>${emptyMessage.sub}</p>
      </div>`;
  }
  const visible = items.slice(0, TIMELINE_SHOWN);
  const hasMore = items.length > TIMELINE_SHOWN;
  const remaining = items.length - TIMELINE_SHOWN;
  const list = visible.map(item => {
    const s = findSaree(item.saree_id);
    if(!s) return '';
    let cls, icon, verb, verbClass;
    if(item.event_type === 'favourite_added'){ cls = 'add'; icon = '♥'; verb = 'added to favourites'; verbClass = 'verb-add'; }
    else if(item.event_type === 'favourite_removed'){ cls = 'remove'; icon = '♡'; verb = 'removed from favourites'; verbClass = 'verb-remove'; }
    else { cls = 'wa'; icon = '💬'; verb = 'sent a WhatsApp enquiry'; verbClass = 'verb-wa'; }
    return `
      <div class="tl-item">
        <div class="tl-icon ${cls}">${icon}</div>
        <div class="tl-main">
          <div class="tl-title">Someone <b class="${verbClass}">${verb}</b></div>
          <div class="tl-meta">
            ${s.code ? `<span class="tl-code">${escapeHtml(s.code)}</span>` : ''}
            <span class="tl-name">${escapeHtml(s.name)}</span>
            <span class="tl-cat">${escapeHtml(s.category)}</span>
          </div>
        </div>
        <div class="tl-time">${timeAgo(item.created_at)}</div>
      </div>`;
  }).join('');
  const moreBtn = hasMore ? `
    <div class="tl-more-wrap">
      <button class="btn btn-ghost btn-sm" data-action="tl-show-more">
        Show ${Math.min(TIMELINE_PAGE_SIZE, remaining)} more
        <span class="tl-more-count">${remaining} remaining</span>
      </button>
    </div>` : '';
  return chips + `<div class="tl-list">${list}</div>` + moreBtn;
}

function sortIcon(field){
  if(INVENTORY_SORT !== field) return '↕';
  return INVENTORY_SORT_DIR === 'asc' ? '↑' : '↓';
}

function getInventoryList(){
  let list = SAREES.slice();
  const q = INVENTORY_QUERY.toLowerCase().trim();

  if(q){
    list = list.filter(s => {
      const hay = ((s.name||'') + ' ' + (s.code||'') + ' ' + (s.fabric||'') + ' ' + (s.category||'')).toLowerCase();
      return hay.includes(q);
    });
  }

  const dir = INVENTORY_SORT_DIR === 'asc' ? 1 : -1;
  if(INVENTORY_SORT === 'name'){
    list.sort((a,b) => (a.name||'').localeCompare(b.name||'') * dir);
  } else if(INVENTORY_SORT === 'price'){
    list.sort((a,b) => ((a.price||0) - (b.price||0)) * dir);
  } else if(INVENTORY_SORT === 'stock'){
    list.sort((a,b) => ((a.stock||0) - (b.stock||0)) * dir);
  } else {
    list.sort((a,b) => {
      const ta = new Date(a.created_at).getTime() || 0;
      const tb = new Date(b.created_at).getTime() || 0;
      return (ta - tb) * dir;
    });
  }

  return list;
}

function renderInventoryRow(s){
  const c = FAVOURITE_COUNTS[s.id] || 0;
  const staged = PENDING.stock[s.id];
  const displayStock = staged !== undefined ? staged : s.stock;
  const isStagedDelete = PENDING.deletes.has(s.id);
  const dirty = staged !== undefined;
  const stClass = displayStock <= 0 ? 'out' : displayStock <= 5 ? 'low' : '';
  const images = Array.isArray(s.images) ? s.images : [];
  const typeLabel = (s.product_type || 'saree').toUpperCase();
  const thumbUrl = images[0]?.url || s.image_url;

  if(total === 0 && INVENTORY_QUERY.trim()){
    return `
      <div class="inv-empty show">
        <svg class="empty-illustration" viewBox="0 0 200 160" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="emptyBox" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#FBEDF0"/>
              <stop offset="100%" stop-color="#F3D8E0"/>

            <linearGradient id="emptyLid" x1="0" y1="0" x2="0" y2="1">

              <stop offset="100%" stop-color="#FBE9EF"/>

          <path d="M46 62 L154 62 L154 74 Q154 76 152 76 L48 76 Q46 76 46 74 Z" fill="url(#emptyLid)"/>
          <line x1="60" y1="112" x2="140" y2="112" stroke="#E8C6D1" stroke-width="1.4" opacity=".8"/>
          <circle cx="126" cy="46" r="20" fill="url(#emptyGlass)" stroke="#A63D5C" stroke-width="2.4"/>

          <line x1="140" y1="61" x2="152" y2="74" stroke="#A63D5C" stroke-width="3" stroke-linecap="round"/>
          <text x="126" y="54" text-anchor="middle" font-family="Poppins,sans-serif" font-size="22" font-weight="700" fill="#A63D5C">?</text>
          <circle cx="42" cy="34" r="3" fill="#C9A961" opacity=".6"/>
          <circle cx="60" cy="24" r="2" fill="#C9A961" opacity=".4"/>
          <circle cx="164" cy="120" r="3" fill="#C9A961" opacity=".5"/>
        </svg>
        <div class="empty-title">No Result Found</div>
        <div class="empty-sub">We couldn't find any product matching your search. Try a different name, ID or fabric.</div>
        <button type="button" class="empty-reset" data-action="clear-inventory-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          Clear search
        </button>
      </div>`;
  }

  const visible = list.slice(0, INVENTORY_SHOWN);
  const hasMore = total > INVENTORY_SHOWN;
  const remaining = total - INVENTORY_SHOWN;

  return `
    <div class="table-wrap"><table>
      <thead><tr>

    ${hasMore ? `

        <button class="btn btn-ghost btn-sm" data-action="show-more-inventory">
          Show ${Math.min(INVENTORY_PAGE_SIZE, remaining)} more
          <span class="inv-more-count">${remaining} remaining</span>
        </button>
      </div>
    ` : ''}
  `;
}

function updateInventoryTable(){
  const container = document.getElementById('invTableContainer');
  if(!container) return;
  container.innerHTML = renderInventoryTableInner();

  const countEl = document.getElementById('invCount');
  if(countEl){
    const list = getInventoryList();
    const n = list.length;
    const q = INVENTORY_QUERY.trim();
    countEl.textContent = q
      ? `${n} match${n === 1 ? '' : 'es'}`
      : `${n} product${n === 1 ? '' : 's'}`;
  }

  updateSaveBar();
}

/* =========================================================================
   FORM PIECES
   ========================================================================= */
function productTypeSelector(selected){
  return `
    <div class="type-selector">
      ${PRODUCT_TYPES.map(t => `
        <button type="button"
                class="type-btn ${selected === t.value ? 'active' : ''}"
                data-action="pick-type" data-type="${t.value}">
          ${t.label}
        </button>
      `).join('')}
    </div>`;
}

function sizeChips(selected){
  const arr = Array.isArray(selected) ? selected : [];
  return `
    <div class="size-chips">
      ${SIZE_OPTIONS.map(sz => `
        <label class="size-chip ${arr.includes(sz) ? 'active' : ''}">
          <input type="checkbox" name="sizes" value="${sz}" ${arr.includes(sz) ? 'checked' : ''} data-action="toggle-size-chip" />
          ${sz}
        </label>
      `).join('')}
    </div>`;
}

        <div class="field"><label>Care</label><input name="care" type="text" placeholder="Dry clean only" /></div>

          <input type="hidden" name="c2" id="pC2" value="#4A0F23" />

    </div>

    <div class="panel">
      <h2><span class="dot"></span>Account</h2>
      <p class="sub">Signed in as <b>${escapeHtml(SESSION?.user?.email || '')}</b></p>
      <form data-form="change-password" style="max-width:420px">
        <div class="field"><label>New password</label><input name="password" type="password" minlength="8" required /></div>
        <div class="field"><label>Confirm new password</label><input name="confirm" type="password" minlength="8" required /></div>
        <button type="submit" class="btn btn-ghost">Update Password</button>
      </form>
    </div>

  </div></div>
  ${EDITING_ID ? EditModal() : ''}`;
}

/* =========================================================================
   ACTIONS
   ========================================================================= */
function stageStock(id, value){
  const stock = Math.max(0, parseInt(value) || 0);
  const s = findSaree(id);
  if(!s) return;
  if(stock === s.stock) delete PENDING.stock[id];
  else PENDING.stock[id] = stock;
  const input = document.querySelector(`.stock-input[data-id="${id}"]`);
  if(input){
    input.classList.remove('low','out','dirty');
    if(stock <= 0) input.classList.add('out');
    else if(stock <= 5) input.classList.add('low');
    if(PENDING.stock[id] !== undefined) input.classList.add('dirty');
  }
  updateSaveBar();
}
function stageDelete(id){
  const s = findSaree(id);
  if(!s) return;
  if(PENDING.deletes.has(id)) return;
  PENDING.deletes.add(id);
  render();
}
function unstageDelete(id){ PENDING.deletes.delete(id); render(); }
function hasPendingChanges(){ return Object.keys(PENDING.stock).length > 0 || PENDING.deletes.size > 0; }
function updateSaveBar(){
  const bar = document.getElementById('saveBar');
  if(!bar) return;
  const n = Object.keys(PENDING.stock).length + PENDING.deletes.size;
  const msg = document.getElementById('saveMsg');
  if(msg) msg.textContent = `● ${n} unsaved change${n === 1 ? '' : 's'}`;
  bar.style.display = n > 0 ? 'flex' : 'none';
}
async function savePendingChanges(){
  if(!SESSION) return;
  const btn = document.getElementById('saveBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Saving…'; }
  try{
    for(const [id, stock] of Object.entries(PENDING.stock)){
      const { error } = await sb.from('sarees').update({ stock }).eq('id', id);
      if(error) throw error;
    }
    for(const id of PENDING.deletes){
      const { error } = await sb.from('sarees').delete().eq('id', id);
      if(error) throw error;
    }
    const n = Object.keys(PENDING.stock).length + PENDING.deletes.size;
    PENDING = { stock:{}, deletes:new Set() };
    await loadSarees();
    await loadFavouriteCounts();
    render();
    toast(`${n} change${n === 1 ? '' : 's'} saved`, 'success');
  } catch(err){
    toast(err.message || 'Save failed', 'error');
    if(btn){ btn.disabled = false; btn.textContent = 'Save changes'; }
  }
}
function discardPendingChanges(){
  if(!confirm('Discard all unsaved changes?')) return;
  PENDING = { stock:{}, deletes:new Set() };
  render();
}

async function uploadSareePhoto(file){
  const resized = await new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1200;
      let { width, height } = img;
      if(width > MAX){ height = Math.round(height * MAX / width); width = MAX; }
      const canvas = document.createElement('canvas');
      canvas.width = width; canvas.height = height;
      canvas.getContext('2d').drawImage(img, 0, 0, width, height);
      canvas.toBlob(b => resolve(b), 'image/jpeg', 0.85);
    };
    img.src = URL.createObjectURL(file);
  });
  const path = `sarees/${Date.now()}-${Math.random().toString(36).slice(2)}.jpg`;
  const { error } = await sb.storage.from('saree-images').upload(path, resized, {
    cacheControl:'3600', upsert:false, contentType:'image/jpeg'
  });
  if(error) throw error;
  const { data } = sb.storage.from('saree-images').getPublicUrl(path);
  return data.publicUrl;
}

async function deleteSareePhotoByUrl(url){
  if(!url) return;
  try{
    const marker = '/saree-images/';
    const idx = url.indexOf(marker);
    if(idx === -1) return;
    const path = url.slice(idx + marker.length);
    await sb.storage.from('saree-images').remove([path]);
  }catch(e){}
}

function getSelectedSizesFromForm(form){
  return Array.from(form.querySelectorAll('input[name="sizes"]:checked')).map(x => x.value);
}

async function addSaree(form){
  if(!SESSION) return;
  const fd = new FormData(form);
  const product_type = fd.get('product_type') || 'saree';
  const sizes = getSelectedSizesFromForm(form);

  if(!fd.get('name') || !fd.get('category') || !fd.get('fabric')){
    toast('Name, category and fabric are required', 'error'); return;
  }

  const imagesArr = await uploadAllImages(ADD_IMAGES);

  const row = {
    name: String(fd.get('name')).trim(),
    category: String(fd.get('category')).trim(),
    fabric: String(fd.get('fabric')).trim(),
    weave: String(fd.get('weave') || 'Handwoven').trim(),
    price: Math.max(0, parseInt(fd.get('price')) || 0),
    mrp: Math.max(0, parseInt(fd.get('mrp')) || 0),
    stock: Math.max(0, parseInt(fd.get('stock')) || 0),
    rating: Math.min(5, Math.max(1, parseFloat(fd.get('rating')) || 4.5)),
    palette: [fd.get('c1') || '#8C2342', fd.get('c2') || '#4A0F23'],
    gold: fd.get('gold') || '#D9B96A',
    tag: String(fd.get('tag') || '').trim(),
    description: String(fd.get('description') || '').trim(),
    occasion: String(fd.get('occasion') || 'Festive').trim(),
    blouse: String(fd.get('blouse') || 'Unstitched blouse piece included').trim(),
    care: String(fd.get('care') || 'Dry clean only').trim(),
    product_type,
    sizes,
    images: imagesArr,
    image_url: imagesArr[0]?.url || null
  };

  const { error } = await sb.from('sarees').insert(row);
  if(error){
    for(const img of imagesArr) await deleteSareePhotoByUrl(img.url);
    toast(error.message, 'error'); return;
  }

  ADD_IMAGES.forEach(x => { if(x.previewUrl) URL.revokeObjectURL(x.previewUrl); });
  ADD_IMAGES = [];
  await loadSarees();
  render();
  toast('✓ Product added to shop', 'success');
}

async function saveEditedSaree(form){
  if(!SESSION) return;
  const fd = new FormData(form);
  const id = fd.get('id');
  const original = findSaree(id);
  if(!original) return;

  // Product type is locked — always use the original value
  const product_type = original.product_type || 'saree';
  const sizes = getSelectedSizesFromForm(form);

  const finalImages = await uploadAllImages(EDIT_IMAGES);

  const oldUrls = (Array.isArray(original.images) ? original.images.map(x => x.url) : []).filter(Boolean);
  const newUrls = finalImages.map(x => x.url);
  for(const oldUrl of oldUrls){
    if(!newUrls.includes(oldUrl)){
      await deleteSareePhotoByUrl(oldUrl);
    }
  }
  if(original.image_url && !newUrls.includes(original.image_url)){
    await deleteSareePhotoByUrl(original.image_url);
  }

  // NOTE: stock is intentionally NOT included here — it's managed from the Inventory table only
  const updates = {
    name: String(fd.get('name')).trim(),
    category: String(fd.get('category')).trim(),
    fabric: String(fd.get('fabric')).trim(),
    weave: String(fd.get('weave') || 'Handwoven').trim(),
    price: Math.max(0, parseInt(fd.get('price')) || 0),
    mrp: Math.max(0, parseInt(fd.get('mrp')) || 0),
    rating: Math.min(5, Math.max(1, parseFloat(fd.get('rating')) || 4.5)),
    palette: [fd.get('c1') || '#8C2342', fd.get('c2') || '#4A0F23'],
    gold: fd.get('gold') || '#D9B96A',
    tag: String(fd.get('tag') || '').trim(),
    description: String(fd.get('description') || '').trim(),
    occasion: String(fd.get('occasion') || 'Festive').trim(),
    blouse: String(fd.get('blouse') || 'Unstitched blouse piece included').trim(),
    care: String(fd.get('care') || 'Dry clean only').trim(),
    product_type,
    sizes,
    images: finalImages,
    image_url: finalImages[0]?.url || null
  };

  const { error } = await sb.from('sarees').update(updates).eq('id', id);
  if(error){ toast(error.message, 'error'); return; }

  EDIT_IMAGES.forEach(x => { if(x.previewUrl) URL.revokeObjectURL(x.previewUrl); });
  EDIT_IMAGES = [];
  EDITING_ID = null;

  await loadSarees();
  await loadFavouriteCounts();
  render();
  toast('✓ Product updated', 'success');
}

/* =========================================================================
   RENDER
   ========================================================================= */
function render(){
  const app = document.getElementById('app');
  if(location.hash.includes('reset') && SESSION){
    app.innerHTML = AuthScreen(true);
    return;
  }
  if(!SESSION){
    app.innerHTML = AuthScreen(false);
    return;
  }
  app.innerHTML = Dashboard();
  updateSaveBar();
}

/* =========================================================================
   TOAST
   ========================================================================= */
let toastTimer;
function toast(msg, type){
  const el = document.getElementById('toast');
  if(!el) return;
  el.className = 'toast' + (type ? ' ' + type : '');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

/* =========================================================================
   EVENTS
   ========================================================================= */
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const a = el.dataset.action;

  if(a === 'auth-tab'){ authTab = el.dataset.tab; authMsg = null; render(); return; }
  if(a === 'signout'){ await signOut(); return; }
  if(a === 'delete-saree'){ stageDelete(el.dataset.id); return; }
  if(a === 'undo-delete'){ unstageDelete(el.dataset.id); return; }
  if(a === 'save-changes'){ await savePendingChanges(); return; }
  if(a === 'discard-changes'){ discardPendingChanges(); return; }

  /* Product type picker — ADD FORM ONLY */
  if(a === 'pick-type'){
    const type = el.dataset.type;
    const form = document.getElementById('addForm');
    if(!form) return;
    document.getElementById('addProductType').value = type;
    document.querySelectorAll('#addForm .type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === type));
    form.querySelector('[data-blouse-wrap]').style.display = type === 'saree' ? '' : 'none';
    form.querySelector('[data-sizes-wrap]').style.display = type === 'saree' ? 'none' : '';
    return;
  }

  if(a === 'toggle-size-chip'){
    const label = el.closest('.size-chip');
    if(label) label.classList.toggle('active', el.checked);
    return;
  }

  if(a === 'pick-palette'){
    document.querySelectorAll('[data-palette-add] .palette-swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('pC1').value = el.dataset.c1;
    document.getElementById('pC2').value = el.dataset.c2;
    document.getElementById('pGold').value = el.dataset.gold;
    return;
  }
  if(a === 'pick-edit-palette'){
    document.querySelectorAll('[data-palette-edit] .palette-swatch').forEach(s => s.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('epC1').value = el.dataset.c1;
    document.getElementById('epC2').value = el.dataset.c2;
    document.getElementById('epGold').value = el.dataset.gold;
    return;
  }

  if(a === 'remove-image'){
    removeImage(el.dataset.target, el.dataset.imgid);
    return;
  }

  if(a === 'edit-saree'){
    EDITING_ID = el.dataset.id;
    const s = findSaree(EDITING_ID);
    EDIT_IMAGES = [];
    if(s){
      const existing = Array.isArray(s.images) ? s.images : [];
      if(existing.length){
        EDIT_IMAGES = existing.map((img) => ({
          _id: makeId(),
          file: null,
          previewUrl: null,
          url: img.url,
          hex: img.hex || '#CCCCCC',
          name: img.name || 'Colour'
        }));
      } else if(s.image_url){
        EDIT_IMAGES = [{
          _id: makeId(),
          file: null,
          previewUrl: null,
          url: s.image_url,
          hex: '#CCCCCC',
          name: 'Colour'
        }];
      }
    }
    render();
    return;
  }
  if(a === 'close-edit'){
    EDIT_IMAGES.forEach(x => { if(x.previewUrl) URL.revokeObjectURL(x.previewUrl); });
    EDIT_IMAGES = [];
    EDITING_ID = null;
    render();
    return;
  }
  if(a === 'modal-backdrop'){
    if(e.target.classList.contains('modal-overlay')){
      EDIT_IMAGES.forEach(x => { if(x.previewUrl) URL.revokeObjectURL(x.previewUrl); });
      EDIT_IMAGES = [];
      EDITING_ID = null;
      render();
    }
    return;
  }
  if(a === 'save-edit'){
    const form = document.getElementById('editSareeForm');
    if(!form) return;
    const btn = el;
    const original = btn.innerHTML;
    btn.disabled = true; btn.style.opacity = '.7'; btn.innerHTML = 'Saving…';
    try{ await saveEditedSaree(form); }
    finally{
      if(document.body.contains(btn)){
        btn.disabled = false; btn.style.opacity = ''; btn.innerHTML = original;
      }
    }
    return;
  }

  /* Inventory: sorting */
  if(a === 'sort-inventory'){
    const sort = el.dataset.sort;
    if(INVENTORY_SORT === sort){
      INVENTORY_SORT_DIR = INVENTORY_SORT_DIR === 'asc' ? 'desc' : 'asc';
    } else {
      INVENTORY_SORT = sort;
      INVENTORY_SORT_DIR = sort === 'name' ? 'asc' : 'desc';
    }
    INVENTORY_SHOWN = INVENTORY_PAGE_SIZE;
    updateInventoryTable();
    return;
  }

  /* Inventory: show more */
  if(a === 'show-more-inventory'){
    INVENTORY_SHOWN += INVENTORY_PAGE_SIZE;
    updateInventoryTable();
    return;
  }

  /* Inventory: clear search */
  if(a === 'clear-inventory-search'){
    INVENTORY_QUERY = '';
    INVENTORY_SHOWN = INVENTORY_PAGE_SIZE;
    const input = document.getElementById('inventorySearch');
    if(input) input.value = '';
    updateInventoryTable();
    if(input) input.focus();
    return;
  }

  if(a === 'tl-filter'){ TIMELINE_FILTER = el.dataset.filter; TIMELINE_SHOWN = TIMELINE_PAGE_SIZE; render(); return; }
  if(a === 'tl-show-more'){ TIMELINE_SHOWN += TIMELINE_PAGE_SIZE; render(); return; }
});

document.addEventListener('change', async e => {
  if(e.target.matches('[data-action="update-stock"]')){
    stageStock(e.target.dataset.id, e.target.value);
    return;
  }
  if(e.target.matches('[data-action="add-images"]')){
    const input = e.target;
    const target = input.dataset.target;
    const fileArr = Array.from(input.files || []);
    input.value = '';
    if(!fileArr.length) return;
    await addImagesFromFiles(fileArr, target);
    return;
  }
});

document.addEventListener('input', e => {
  if(e.target.id === 'inventorySearch'){
    INVENTORY_QUERY = e.target.value;
    INVENTORY_SHOWN = INVENTORY_PAGE_SIZE;
    updateInventoryTable();
    return;
  }
  if(e.target.matches('[data-action="update-stock"]')){
    clearTimeout(e.target._t);
    e.target._t = setTimeout(() => stageStock(e.target.dataset.id, e.target.value), 300);
    return;
  }
  if(e.target.matches('[data-action="image-name"]')){
    updateImageName(e.target.dataset.target, e.target.dataset.imgid, e.target.value);
    return;
  }
});

document.addEventListener('submit', async e => {
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  const kind = form.dataset.form;
  const fd = new FormData(form);

  if(kind === 'signup'){
    const p = String(fd.get('password') || '');
    if(p.length < 8){ authMsg = { type:'error', text:'Password must be at least 8 characters.' }; render(); return; }
    await signUp(String(fd.get('email')).trim(), p); return;
  }
  if(kind === 'signin'){
    await signIn(String(fd.get('email')).trim(), String(fd.get('password'))); return;
  }
  if(kind === 'reset-password'){
    await sendReset(String(fd.get('email')).trim()); return;
  }
  if(kind === 'set-new-password'){
    const p = String(fd.get('password') || ''), c = String(fd.get('confirm') || '');
    if(p.length < 8){ toast('Password too short', 'error'); return; }
    if(p !== c){ toast('Passwords do not match', 'error'); return; }
    await changePassword(p);
    history.replaceState(null, '', location.pathname);
    location.reload(); return;
  }
  if(kind === 'change-password'){
    const p = String(fd.get('password') || ''), c = String(fd.get('confirm') || '');
    if(p.length < 8){ toast('Password too short', 'error'); return; }
    if(p !== c){ toast('Passwords do not match', 'error'); return; }
    await changePassword(p); form.reset(); return;
  }
  if(kind === 'add-saree'){
    await addSaree(form);
    form.reset();
    const addForm = document.getElementById('addForm');
    if(addForm){
      document.querySelectorAll('#addForm .type-btn').forEach(b => b.classList.toggle('active', b.dataset.type === 'saree'));
      document.getElementById('addProductType').value = 'saree';
      addForm.querySelector('[data-blouse-wrap]').style.display = '';
      addForm.querySelector('[data-sizes-wrap]').style.display = 'none';
      document.querySelectorAll('#addForm .size-chip').forEach(c => { c.classList.remove('active'); const i = c.querySelector('input'); if(i) i.checked = false; });
      document.querySelectorAll('[data-palette-add] .palette-swatch').forEach((s,i) => s.classList.toggle('active', i === 0));
      document.getElementById('pC1').value = '#8C2342';
      document.getElementById('pC2').value = '#4A0F23';
      document.getElementById('pGold').value = '#D9B96A';
    }
    return;
  }
});

/* =========================================================================
   INIT
   ========================================================================= */
(async function init(){
  await handleResetRedirect();
  await loadSession();
  if(SESSION){
    await loadSarees();
    await loadFavouriteCounts();
    subscribeRealtime();
  }
  render();

  sb.auth.onAuthStateChange(async (_evt, session) => {
    SESSION = session;
    if(session){
      await loadSarees();
      await loadFavouriteCounts();
      subscribeRealtime();
    }
    render();
  });
})();
</script>
